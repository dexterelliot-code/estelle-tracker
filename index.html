<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estelle's Tracker</title>
<meta name="description" content="Estelle's private endometriosis symptom tracker">
<meta name="theme-color" content="#f7f4f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121011" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Estelle">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root {
  color-scheme: light;
  --bg: #f7f4f2;
  --card: #ffffff;
  --card-2: #f3eeeb;
  --text: #1f1a1d;
  --text-2: #5b5258;
  --muted: #7d7479;
  --line: #e7e0dc;
  --accent: #8a3f63;
  --accent-ink: #ffffff;
  --accent-soft: #f4e6ec;
  --danger: #b3261e;
  --danger-soft: #fbe9e7;
  --ok: #1f6b3a;
  --ok-soft: #e5f2e8;
  --warn: #8a5a00;
  --warn-soft: #fbf0d9;
  --chart-surface: #fcfcfb;
  --chart-grid: #ece8e3;
  --chart-axis: #c3c2b7;
  --chart-muted: #6f6c66;
  --chart-band: rgba(227, 73, 72, 0.10);
  --chart-logged: #9a8f95;
  --chart-marker: #6250d6;
  --chart-bar: #2a78d6;
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100;
  --series-5: #e87ba4; --series-6: #008300; --series-7: #6250d6; --series-8: #e34948;
  --seq-0: #e8e4e1; --seq-1: #cde2fb; --seq-2: #86b6ef; --seq-3: #3987e5; --seq-4: #1c5cab; --seq-5: #0d366b;
  --radius: 16px;
  --tabbar-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #121011;
    --card: #1d1a1c;
    --card-2: #262225;
    --text: #f2ecef;
    --text-2: #c9bfc4;
    --muted: #a39aa0;
    --line: #342f32;
    --accent: #e3a3c1;
    --accent-ink: #2a0f1d;
    --accent-soft: #3a2430;
    --danger: #ff8a80;
    --danger-soft: #3b1f1d;
    --ok: #7fd197;
    --ok-soft: #1c3324;
    --warn: #f2c66d;
    --warn-soft: #3a2f17;
    --chart-surface: #1a1a19;
    --chart-grid: #2c2c2a;
    --chart-axis: #4a4a46;
    --chart-muted: #a3a29a;
    --chart-band: rgba(230, 103, 103, 0.16);
    --chart-logged: #8d8489;
    --chart-marker: #9085e9;
    --chart-bar: #3987e5;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
    --series-5: #d55181; --series-6: #008300; --series-7: #9085e9; --series-8: #e66767;
    --seq-0: #2a2629; --seq-1: #184f95; --seq-2: #256abf; --seq-3: #3987e5; --seq-4: #86b6ef; --seq-5: #cde2fb;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", sans-serif;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
h1, h2, h3 { margin: 0; line-height: 1.2; }
h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 18px; font-weight: 650; }
h3 { font-size: 15px; font-weight: 650; }
.small { font-size: 13px; color: var(--text-2); }
.muted { color: var(--muted); }
.hidden { display: none !important; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

#app { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 16px) 16px calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 24px); }
.screen-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 4px 0 16px; }
.screen-head p { margin: 4px 0 0; }

.card { background: var(--card); border-radius: var(--radius); padding: 16px; margin: 0 0 14px; border: 1px solid var(--line); }
.card > h2, .card > h3 { margin-bottom: 8px; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
.stack > * + * { margin-top: 10px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-weight: 600; text-decoration: none; color: var(--text); }
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn-soft { background: var(--accent-soft); color: var(--text); border-color: transparent; }
.btn-danger { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
.btn-block { width: 100%; }
.btn-big { min-height: 64px; font-size: 19px; border-radius: 18px; }
.btn-small { min-height: 36px; padding: 6px 12px; font-size: 14px; border-radius: 10px; }
.btn[disabled] { opacity: 0.55; cursor: default; }
.link-btn { background: none; border: 0; color: var(--accent); font-weight: 600; padding: 6px 0; min-height: 36px; }
.icon-btn { background: none; border: 0; min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 12px; color: var(--text); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 0; }
.quick { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
.quick .btn { flex-direction: column; gap: 4px; min-height: 72px; font-size: 13px; padding: 8px 6px; text-align: center; line-height: 1.2; }

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 8px 13px; font-size: 14px; min-height: 38px; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.chip .sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.seg { display: flex; background: var(--card-2); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { white-space: nowrap; flex: 1; border: 0; background: none; border-radius: 9px; min-height: 36px; font-size: 14px; font-weight: 600; color: var(--text-2); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,0.12); }

/* Status */
.pill { white-space: nowrap; flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: var(--card-2); color: var(--text-2); border: 0; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.err { background: var(--danger-soft); color: var(--danger); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: inline-block; }
.banner { border-radius: 12px; padding: 10px 12px; font-size: 14px; margin-bottom: 12px; display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
.banner.warn { background: var(--warn-soft); color: var(--warn); }
.banner.err { background: var(--danger-soft); color: var(--danger); }
.banner.info { background: var(--accent-soft); color: var(--text); }
.banner.ok { background: var(--ok-soft); color: var(--ok); }
.demo-tag { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; background: var(--warn-soft); color: var(--warn); border-radius: 6px; padding: 2px 6px; }

/* Forms */
label.f { display: block; font-size: 14px; font-weight: 600; color: var(--text-2); margin: 14px 0 6px; }
.field { width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-size: 16px; }
textarea.field { min-height: 84px; resize: vertical; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.two label.f { margin-top: 0; }
.check { display: flex; gap: 10px; align-items: center; min-height: 44px; font-size: 15px; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); }
details.more { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 4px; }
details.more > summary { list-style: none; min-height: 48px; display: flex; align-items: center; justify-content: space-between; font-weight: 650; cursor: pointer; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::after { content: "+"; font-size: 22px; color: var(--muted); }
details.more[open] > summary::after { content: "–"; }
details.plain > summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 14px; min-height: 36px; display: flex; align-items: center; }

/* Symptom picker */
.group-h { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin: 16px 0 8px; }
.sym-row { background: var(--card-2); border-radius: 14px; padding: 12px; margin-top: 10px; }
.sym-row-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 650; }
.sev { display: grid; grid-template-columns: repeat(11, 1fr) 1.3fr; gap: 3px; margin-top: 10px; }
.sev button { min-height: 40px; border: 1px solid var(--line); background: var(--card); border-radius: 9px; font-size: 14px; font-weight: 600; padding: 0; }
.sev button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.sev-anchors { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 5px; }

/* Sheet (full screen modal) */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,0.35); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 560px; height: 100%; display: flex; flex-direction: column; }
@media (min-width: 600px) { .sheet { height: 94%; border-radius: 20px 20px 0 0; } }
.sheet-h { display: flex; align-items: center; justify-content: space-between; padding: calc(env(safe-area-inset-top) + 8px) 8px 8px 16px; border-bottom: 1px solid var(--line); background: var(--card); }
.sheet-b { flex: 1; overflow-y: auto; padding: 8px 16px 24px; -webkit-overflow-scrolling: touch; }
.sheet-f { padding: 10px 16px calc(env(safe-area-inset-bottom) + 10px); border-top: 1px solid var(--line); background: var(--card); }
.save-msg { font-size: 14px; margin-bottom: 8px; }

/* Tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.tabbar-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tabbar-h); }
.tab { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10.5px; font-weight: 600; color: var(--muted); padding: 0; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--accent); }
.tab.log span.circle { width: 46px; height: 46px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; margin-top: -2px; }
.tab.log { color: var(--text); }

/* Lists */
.day-h { font-size: 13px; font-weight: 700; color: var(--muted); margin: 18px 4px 8px; text-transform: uppercase; letter-spacing: 0.03em; }
.item { display: block; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; }
.item-top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
.item-title { font-weight: 650; margin-top: 2px; }
.sym-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.sym-tag { font-size: 13px; background: var(--card-2); border-radius: 8px; padding: 3px 8px; }
.sym-tag b { font-variant-numeric: tabular-nums; }
.note { font-size: 14px; color: var(--text-2); margin-top: 6px; white-space: pre-wrap; }
.kind-ico { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }

/* Overview strip */
.strip { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; }
.cell { aspect-ratio: 1 / 1.25; border-radius: 6px; border: 0; padding: 0; position: relative; background: var(--seq-0); }
.cell.unk { background: transparent; border: 1.5px dashed var(--line); }
.cell .bl { position: absolute; left: 50%; bottom: 3px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--series-8); }
.cell.today { outline: 2px solid var(--text); outline-offset: 1px; }
.strip-labels { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; font-size: 10px; color: var(--muted); text-align: center; margin-top: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--text-2); margin-top: 10px; align-items: center; }
.legend .sw { width: 14px; height: 3px; border-radius: 2px; display: inline-block; margin-right: 6px; vertical-align: middle; }
.legend .box { width: 12px; height: 12px; border-radius: 3px; display: inline-block; margin-right: 5px; vertical-align: -1px; }

/* Charts */
.chart { width: 100%; overflow: hidden; border-radius: 10px; touch-action: pan-y; }
.chart svg { display: block; }
.picked { background: var(--card-2); border-radius: 12px; padding: 10px 12px; margin-top: 10px; font-size: 14px; }
.picked-row { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
.picked-row b { font-variant-numeric: tabular-nums; }
.range-bar { position: sticky; top: 0; z-index: 30; background: var(--bg); padding: calc(env(safe-area-inset-top) + 6px) 0 10px; margin: -6px 0 6px; }
.month { border-top: 1px solid var(--line); padding: 12px 0; }
.month:first-child { border-top: 0; }
.month-h { display: flex; justify-content: space-between; align-items: baseline; }
.cov { height: 6px; background: var(--card-2); border-radius: 3px; margin: 6px 0 8px; overflow: hidden; }
.cov > div { height: 100%; background: var(--chart-logged); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--card-2); border-radius: 10px; padding: 8px; }
.stat .v { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 11.5px; color: var(--text-2); line-height: 1.25; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th, table.t td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }

/* Insights */
.insight .type { font-size: 12px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.04em; }
.insight .meta { font-size: 13px; color: var(--text-2); margin-top: 8px; }
.insight .limits { font-size: 13px; color: var(--muted); margin-top: 6px; }

/* Toast */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 14px); z-index: 60; background: var(--text); color: var(--bg); border-radius: 14px; padding: 12px 16px; font-size: 15px; display: flex; gap: 14px; align-items: center; max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0,0,0,0.2); }
.toast button { background: none; border: 0; color: inherit; font-weight: 700; text-decoration: underline; min-height: 32px; }

/* Print summary */
#print { display: none; }
@media print {
  body { background: #fff; color: #000; }
  #app, .tabbar, .sheet-wrap, .toast { display: none !important; }
  #print { display: block; font-size: 12px; }
  #print h1 { font-size: 20px; }
  #print h2 { font-size: 15px; margin: 18px 0 6px; }
  #print svg { max-width: 100%; height: auto; }
  #print table { width: 100%; border-collapse: collapse; }
  #print th, #print td { border-bottom: 1px solid #ccc; padding: 4px; text-align: left; }
  #print .pb { page-break-inside: avoid; }
}

/* Multi-day calendar */
.cal { background: var(--card-2); border-radius: 14px; padding: 10px 12px 12px; margin-top: 4px; }
.cal-h { display: flex; justify-content: space-between; align-items: center; }
.cal-h .icon-btn { font-size: 24px; }
.cal-h .icon-btn[disabled] { opacity: 0.3; }
.cal-g { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-w span { text-align: center; font-size: 12px; color: var(--muted); font-weight: 600; padding: 2px 0; }
.cal-d { min-height: 42px; border: 1px solid var(--line); background: var(--card); border-radius: 10px; font-size: 15px; font-weight: 600; padding: 0; font-variant-numeric: tabular-nums; }
.cal-d[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.cal-d.today { outline: 2px solid var(--text); outline-offset: -2px; }
.cal-d[disabled] { opacity: 0.35; background: transparent; }

.head-actions { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
.head-actions .icon-btn svg { width: 24px; height: 24px; }
.head-actions .icon-btn[aria-current="page"] { color: var(--accent); }
.tabbar { padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
</style>
</head>
<body>
<main id="app" aria-live="polite"><p style="padding:40px 0;text-align:center;color:#7d7479">Loading…</p></main>
<nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
<div id="print" aria-hidden="true"></div>
<noscript>This app needs JavaScript turned on.</noscript>
<script>/* Core: symptom catalogue, date helpers, daily aggregation, monthly stats,
   patterns and sync merge rules. Pure functions only (no DOM, no storage),
   so they can be tested in Node. */
(function (root) {
  'use strict';

  // ---------- Symptom catalogue ----------
  const GROUPS = [
    { id: 'pain', label: 'Pain', scale: ['no pain', 'worst pain imaginable'], items: [
      { id: 'pelvic', label: 'General pelvic pain' },
      { id: 'ovary_r', label: 'Right ovarian pain' },
      { id: 'ovary_l', label: 'Left ovarian pain' },
      { id: 'lower_back', label: 'Lower back pain' },
      { id: 'hip', label: 'Hip pain' },
      { id: 'front_pelvis', label: 'Front pelvis pain' },
      { id: 'knee_pain', label: 'Knee pain' },
      { id: 'knee_swelling', label: 'Knee swelling', scale: ['no swelling', 'severe swelling'] },
      { id: 'rectal', label: 'Rectal / butt lightning pain' },
      { id: 'sex_pain', label: 'Pain during sex' },
      { id: 'other_pain', label: 'Other pain', custom: true }
    ]},
    { id: 'physical', label: 'Other physical', scale: ['not present', 'as bad as it gets'], items: [
      { id: 'bloating', label: 'Bloating / endo belly' },
      { id: 'nausea', label: 'Nausea' },
      { id: 'breast', label: 'Breast pain or tenderness' },
      { id: 'fatigue', label: 'Fatigue' },
      { id: 'low_energy', label: 'Low energy' },
      { id: 'constipation', label: 'Constipation' },
      { id: 'painful_bm', label: 'Painful bowel movements' },
      { id: 'frequent_urination', label: 'Frequent urination', scale: ['not at all', 'constantly'] },
      { id: 'other_physical', label: 'Other physical symptom', custom: true }
    ]},
    { id: 'mood', label: 'Mood & thinking', scale: ['not at all', 'most intense'], items: [
      { id: 'low_mood', label: 'Low mood' },
      { id: 'anxiety', label: 'Anxiety' },
      { id: 'dread', label: 'Dread / impending doom' },
      { id: 'irritability', label: 'Irritability' },
      { id: 'anger', label: 'Anger' },
      { id: 'emo_sensitivity', label: 'Emotional sensitivity' },
      { id: 'crying', label: 'Crying episodes' },
      { id: 'low_motivation', label: 'Low motivation' },
      { id: 'concentration', label: 'Difficulty concentrating' },
      { id: 'overwhelmed', label: 'Feeling overwhelmed' }
    ]},
    { id: 'function', label: 'Daily life', scale: ['no impact', "couldn't do it at all"], items: [
      { id: 'work', label: 'Difficulty working' },
      { id: 'daily_tasks', label: 'Difficulty with daily tasks' },
      { id: 'sleep_disrupted', label: 'Disrupted sleep' },
      { id: 'movement', label: 'Reduced ability to exercise or move' },
      { id: 'social', label: 'Social withdrawal' },
      { id: 'other_impact', label: 'Other impact on daily life', custom: true }
    ]}
  ];

  const ITEM = {};
  GROUPS.forEach(g => g.items.forEach(it => { ITEM[it.id] = Object.assign({ group: g.id }, it); }));
  const GROUP = {};
  GROUPS.forEach(g => { GROUP[g.id] = g; });

  function scaleFor(id) {
    const it = ITEM[id];
    if (!it) return ['none', 'worst'];
    return it.scale || GROUP[it.group].scale;
  }

  // A recorded symptom: { id, severity: 0-10 | null (not rated / unknown), label? (custom text) }
  function seriesKey(s) {
    const it = ITEM[s.id];
    if (it && it.custom && s.label && s.label.trim()) return s.id + ':' + s.label.trim().toLowerCase();
    return s.id;
  }
  function seriesGroup(key) {
    const it = ITEM[key.split(':')[0]];
    return it ? it.group : 'physical';
  }
  function seriesLabel(key, labels) {
    const [id, custom] = key.split(':');
    const it = ITEM[id];
    if (custom) {
      const nice = (labels && labels[key]) || custom;
      return (it ? it.label.replace(/ symptom$/, '') : 'Other') + ': ' + nice;
    }
    return it ? it.label : key;
  }

  // ---------- Dates (local calendar days, handled as UTC day numbers) ----------
  const DAY = 86400000;
  function pad(n) { return String(n).padStart(2, '0'); }
  function todayStr(now) {
    const d = now || new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function dayNum(str) {
    const [y, m, d] = str.split('-').map(Number);
    return Math.round(Date.UTC(y, m - 1, d) / DAY);
  }
  function dayStr(n) {
    const d = new Date(n * DAY);
    return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
  }
  function addDays(str, k) { return dayStr(dayNum(str) + k); }
  function monthKey(str) { return str.slice(0, 7); }
  function monthStart(mk) { return mk + '-01'; }
  function monthEnd(mk) {
    const [y, m] = mk.split('-').map(Number);
    return dayStr(Math.round(Date.UTC(y, m, 1) / DAY) - 1);
  }
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function fmtDay(str, withYear) {
    const [y, m, d] = str.split('-').map(Number);
    return d + ' ' + MONTHS[m - 1] + (withYear ? ' ' + y : '');
  }
  function fmtMonth(mk) {
    const [y, m] = mk.split('-').map(Number);
    return MONTHS[m - 1] + ' ' + y;
  }

  // ---------- Record helpers ----------
  function active(records, includeDemo) {
    return records.filter(r => !r.deleted && (includeDemo || !r.demo));
  }
  function isPresent(sev) { return sev === null || sev === undefined || sev > 0; }

  // Build per-day observations from symptom entries.
  // Rule: a day with no entry is UNKNOWN. A "no significant symptoms" entry
  // records 0 for any symptom not otherwise recorded that day.
  function buildDays(records) {
    const days = new Map();
    const labels = {};
    for (const r of records) {
      if (r.kind !== 'entry' || r.deleted) continue;
      const d = r.data.date;
      if (!d) continue;
      let day = days.get(d);
      if (!day) { day = { date: d, entries: [], noSymptoms: false, sym: new Map() }; days.set(d, day); }
      day.entries.push(r);
      if (r.data.noSymptoms) { day.noSymptoms = true; continue; }
      for (const s of (r.data.symptoms || [])) {
        const key = seriesKey(s);
        if (s.label) labels[key] = s.label.trim();
        const sev = (s.severity === null || s.severity === undefined || s.severity === '') ? null : Number(s.severity);
        let o = day.sym.get(key);
        if (!o) { o = { max: null, present: false, count: 0 }; day.sym.set(key, o); }
        o.count++;
        if (sev !== null) o.max = o.max === null ? sev : Math.max(o.max, sev);
        if (isPresent(sev)) o.present = true;
      }
    }
    return { days, labels };
  }

  // Value of one symptom on one day: number, 'unrated' (present, no score), or undefined (unknown)
  function dayValue(day, key) {
    if (!day) return undefined;
    const o = day.sym.get(key);
    if (o) return o.max !== null ? o.max : 'unrated';
    if (day.noSymptoms) return 0;
    return undefined;
  }
  // Highest recorded value across a set of keys (null keys = all symptoms).
  // Returns { value: number|undefined, present: bool, implied: bool }
  function dayGroupValue(day, keys) {
    if (!day) return { value: undefined, present: false, implied: false };
    let max, present = false, any = false;
    for (const [key, o] of day.sym) {
      if (keys && !keys.has(key) && !keys.has('group:' + seriesGroup(key))) continue;
      any = true;
      if (o.present) present = true;
      if (o.max !== null) max = max === undefined ? o.max : Math.max(max, o.max);
    }
    if (max === undefined && day.noSymptoms) return { value: 0, present, implied: !any };
    return { value: max, present, implied: false };
  }

  function seriesPoints(daysMap, key, from, to) {
    const pts = [];
    const a = dayNum(from), b = dayNum(to);
    for (const day of daysMap.values()) {
      const n = dayNum(day.date);
      if (n < a || n > b) continue;
      const v = dayValue(day, key);
      if (v === undefined) continue;
      pts.push({ n, date: day.date, value: v === 'unrated' ? null : v, unrated: v === 'unrated', implied: !day.sym.has(key) });
    }
    return pts.sort((p, q) => p.n - q.n);
  }

  // Episodes: runs of days where the symptom set is recorded as present.
  // Two recorded days up to MERGE_GAP days apart join the same episode.
  const MERGE_GAP = 2;
  function episodes(daysMap, keys) {
    const ns = [];
    for (const day of daysMap.values()) {
      if (dayGroupValue(day, keys).present) ns.push(dayNum(day.date));
    }
    ns.sort((a, b) => a - b);
    const out = [];
    for (const n of ns) {
      const last = out[out.length - 1];
      if (last && n - last.endN <= MERGE_GAP) { last.endN = n; last.days++; }
      else out.push({ startN: n, endN: n, days: 1 });
    }
    return out.map(e => ({ start: dayStr(e.startN), end: dayStr(e.endN), recordedDays: e.days }));
  }

  function bleedingDaySet(records, today) {
    const set = new Set();
    for (const r of records) {
      if (r.kind !== 'bleeding' || r.deleted || !r.data.startDate) continue;
      const a = dayNum(r.data.startDate);
      const b = dayNum(r.data.endDate || today);
      for (let n = a; n <= Math.max(a, b) && n - a < 400; n++) set.add(n);
    }
    return set;
  }

  // ---------- Monthly comparison ----------
  function keySetFor(target) {
    if (!target || target === 'all') return null;
    if (target.startsWith('group:')) return new Set([target]);
    return new Set([target]);
  }
  function avg(arr) { return arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null; }

  function monthlySummary(records, opts) {
    const { from, to, target, today } = opts;
    const { days, labels } = buildDays(records);
    const keys = keySetFor(target);
    const eps = episodes(days, keys);
    const bleed = bleedingDaySet(records, today);
    const lastDay = dayNum(to) < dayNum(today) ? to : today;
    const months = [];
    let mk = monthKey(from);
    while (mk <= monthKey(lastDay)) {
      const s = monthStart(mk) < from ? from : monthStart(mk);
      const e = monthEnd(mk) > lastDay ? lastDay : monthEnd(mk);
      const sN = dayNum(s), eN = dayNum(e);
      let logged = 0, symptomatic = 0, highest = null, bleedingDays = 0;
      const dailyMax = [], mood = [], phys = [];
      const counts = new Map();
      for (let n = sN; n <= eN; n++) {
        if (bleed.has(n)) bleedingDays++;
        const day = days.get(dayStr(n));
        if (!day) continue;
        logged++;

        if (g.present) symptomatic++;
        if (typeof g.value === 'number') { dailyMax.push(g.value); highest = highest === null ? g.value : Math.max(highest, g.value); }
        const m = dayGroupValue(day, new Set(['group:mood']));
        if (typeof m.value === 'number') mood.push(m.value);
        const p = dayGroupValue(day, new Set(['group:pain', 'group:physical']));
        if (typeof p.value === 'number') phys.push(p.value);
        for (const [key, o] of day.sym) {
          if (o.present) counts.set(key, (counts.get(key) || 0) + 1);
        }
      }
      const top = [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, 3)
        .map(([key, c]) => ({ key, label: seriesLabel(key, labels), days: c }));
      months.push({
        month: mk, from: s, to: e,
        daysInPeriod: eN - sN + 1,
        loggedDays: logged,
        symptomaticDays: symptomatic,
        ratedDays: dailyMax.length,
        avgSeverity: avg(dailyMax),
        highest,
        episodes: eps.filter(x => x.start >= s && x.start <= e).length,
        top,
        moodAvg: avg(mood), physAvg: avg(phys),
        bleedingDays
      });
      const [y, m] = mk.split('-').map(Number);
      mk = m === 12 ? (y + 1) + '-01' : y + '-' + pad(m + 1);
    }
    return months;
  }

  // ---------- Patterns to explore ----------
  function round1(x) { return Math.round(x * 10) / 10; }
  function patterns(records, opts) {
    const { from, to, today } = opts;
    const inRange = records.filter(r => r.kind !== 'entry' || (r.data.date >= from && r.data.date <= to));
    const { days, labels } = buildDays(inRange);
    const dayList = [...days.values()].sort((a, b) => a.date.localeCompare(b.date));
    const out = [];
    const loggedCount = dayList.length;
    const range = loggedCount ? [dayList[0].date, dayList[dayList.length - 1].date] : null;
    const common = 'Only days you logged are included; unlogged days are unknown, not symptom-free.';

    // 1. Symptoms that occur together
    const presentDays = new Map();
    for (const day of dayList) for (const [k, o] of day.sym) if (o.present) {
      if (!presentDays.has(k)) presentDays.set(k, []);
      presentDays.get(k).push(day.date);
    }
    const keys = [...presentDays.keys()].filter(k => presentDays.get(k).length >= 5);
    const pairs = [];
    for (let i = 0; i < keys.length; i++) for (let j = i + 1; j < keys.length; j++) {

      const both = B.filter(d => A.has(d));
      const ratio = both.length / Math.min(A.size, B.length);
      if (both.length >= 5 && ratio >= 0.6) pairs.push({ a: keys[i], b: keys[j], both, ratio, na: A.size, nb: B.length });
    }
    pairs.sort((p, q) => q.both.length - p.both.length);
    for (const p of pairs.slice(0, 4)) {
      out.push({
        type: 'Occur together',
        title: seriesLabel(p.a, labels) + ' and ' + seriesLabel(p.b, labels),
        text: 'These were recorded on the same day ' + p.both.length + ' times. ' +
          seriesLabel(p.a, labels) + ' was recorded on ' + p.na + ' days and ' +
          seriesLabel(p.b, labels).toLowerCase() + ' on ' + p.nb + ' days, so they appear to coincide more often than not.',
        range: [p.both[0], p.both[p.both.length - 1]],
        basis: p.both.length + ' shared days out of ' + loggedCount + ' logged days',
        days: p.both,
        limits: common + ' If you tend to log both together out of habit, that can inflate this. Occurring together does not mean one causes the other.'
      });
    }

    // 2. Recurring at similar intervals
    for (const k of keys) {
      const eps = episodes(days, new Set([k]));
      if (eps.length < 4) continue;
      const starts = eps.map(e => dayNum(e.start));
      const gaps = starts.slice(1).map((s, i) => s - starts[i]);
      const mean = avg(gaps);
      const sd = Math.sqrt(avg(gaps.map(g => (g - mean) ** 2)));
      if (mean >= 7 && sd / mean <= 0.25) {
        out.push({
          type: 'Possible recurring pattern',
          title: seriesLabel(k, labels) + ': roughly every ' + Math.round(mean) + ' days',
          text: 'The last ' + eps.length + ' episodes started ' + gaps.join(', ') + ' days apart. This is a possible recurring pattern, not a confirmed cycle.',
          range: [eps[0].start, eps[eps.length - 1].end],
          basis: eps.length + ' recorded episodes (days up to ' + MERGE_GAP + ' apart count as one episode)',
          days: eps.map(e => e.start === e.end ? e.start : e.start + ' to ' + e.end),
          limits: common + ' Gaps in logging can split or merge episodes. This does not identify a menstrual cycle, ovulation or a hormonal cause.'
        });
      }
    }

    // 3. Pain severity across successive months
    const months = monthlySummary(inRange, { from, to, target: 'group:pain', today });
    const good = months.filter(m => m.ratedDays >= 8 && m.avgSeverity !== null);
    if (good.length >= 3) {
      const first = good[0], last = good[good.length - 1];
      const diff = last.avgSeverity - first.avgSeverity;
      const dir = Math.abs(diff) < 1.5 ? 'appears broadly similar' : (diff > 0 ? 'appears to have increased' : 'appears to have decreased');
      out.push({
        type: 'Change over months',
        title: 'Pain severity ' + dir,
        text: 'Average of each logged day\'s highest pain score: ' + good.map(m => fmtMonth(m.month) + ' ' + round1(m.avgSeverity)).join(', ') + '.',
        range: [good[0].from, last.to],
        basis: good.map(m => fmtMonth(m.month) + ': ' + m.ratedDays + ' days with a pain score').join('; '),
        days: [],
        limits: 'Months with fewer than 8 days with a pain score are left out. ' + common + ' You may log more on bad days, which raises averages.'
      });
    }

    // 4. Mood and physical symptoms coinciding
    const moodSet = new Set(['group:mood']), physSet = new Set(['group:pain', 'group:physical']);
    let bothRated = 0; const highBoth = [];
    for (const day of dayList) {
      const m = dayGroupValue(day, moodSet), p = dayGroupValue(day, physSet);
      if (typeof m.value === 'number' && typeof p.value === 'number' && !m.implied && !p.implied) {
        bothRated++;
        if (m.value >= 5 && p.value >= 5) highBoth.push(day.date);
      }
    }
    if (highBoth.length >= 4) {
      out.push({
        type: 'Mood and physical together',
        title: 'Strong mood and physical symptoms on the same days',
        text: 'On ' + highBoth.length + ' of the ' + bothRated + ' days where you rated both, mood and physical symptoms were both 5 or higher. They appear to coincide on these days.',
        range: [highBoth[0], highBoth[highBoth.length - 1]],
        basis: highBoth.length + ' days out of ' + bothRated + ' days with both rated',
        days: highBoth,
        limits: common + ' This shows timing only. It does not show that one causes the other, or that either is hormonal.'
      });
    }

    // 5. Context: stress, sleep, activity
    function compare(name, pick, lowLabel, highLabel) {
      const low = [], high = [];
      for (const day of dayList) {
        const ctx = day.entries.map(e => pick(e.data.context || {})).filter(v => v !== undefined);
        if (!ctx.length) continue;
        const g = dayGroupValue(day, physSet);
        if (typeof g.value !== 'number') continue;
        const c = ctx[0];
        if (c === 'low') low.push({ d: day.date, v: g.value });
        if (c === 'high') high.push({ d: day.date, v: g.value });
      }
      if (low.length >= 5 && high.length >= 5) {
        const a = avg(low.map(x => x.v)), b = avg(high.map(x => x.v));
        if (Math.abs(b - a) >= 1.5) {
          out.push({
            type: 'Possible relationship',
            title: 'Pain/physical scores and ' + name,
            text: 'On days with ' + highLabel + ', your highest pain/physical score averaged ' + round1(b) + ', compared with ' + round1(a) + ' on days with ' + lowLabel + '. Higher scores appear to coincide with ' + highLabel + '.',
            range: [[...low, ...high].map(x => x.d).sort()[0], [...low, ...high].map(x => x.d).sort().pop()],
            basis: high.length + ' days with ' + highLabel + ', ' + low.length + ' days with ' + lowLabel,
            days: high.map(x => x.d),
            limits: common + ' Only days where you recorded ' + name + ' are included. The link could run either way (for example pain disturbing sleep), or both could share another cause.'
          });
        }
      }
    }
    const num = v => (v === '' || v === null || v === undefined) ? undefined : Number(v);
    compare('stress', c => { const s = num(c.stress); return s === undefined ? undefined : s >= 7 ? 'high' : s <= 3 ? 'low' : 'mid'; }, 'stress 3 or below', 'stress 7 or above');
    compare('sleep', c => { const s = num(c.sleepHours); return s === undefined ? undefined : s < 6 ? 'high' : s >= 7 ? 'low' : 'mid'; }, '7+ hours of sleep', 'under 6 hours of sleep');
    compare('activity', c => !c.exercise ? undefined : (c.exercise === 'moderate' || c.exercise === 'hard') ? 'high' : c.exercise === 'none' ? 'low' : 'mid', 'no exercise', 'moderate or hard exercise');

    return { insights: out, loggedDays: loggedCount, range };
  }

  // ---------- Sync merge rules (last write wins, per record) ----------
  function fromRemote(row) {
    return { id: row.id, kind: row.kind, data: row.data || {}, createdAt: row.created_at, updatedAt: row.updated_at, deleted: !!row.deleted, demo: false, dirty: false };
  }
  function toRemote(r, userId) {
    return { id: r.id, user_id: userId, kind: r.kind, data: r.data, created_at: r.createdAt, updated_at: r.updatedAt, deleted: !!r.deleted };
  }

  function mergeRemote(localById, remoteRows) {

      if (!local) { puts.push(remote); continue; }

    for (const r of imported) {
      if (!r || !r.id || !r.kind) { skipped++; continue; }
      const local = localById.get(r.id);

      if (!local) { puts.push(rec); added++; }
      else if (t(rec.updatedAt) > t(local.updatedAt)) { puts.push(rec); updated++; }

  const api = { GROUPS, ITEM, GROUP, scaleFor, seriesKey, seriesGroup, seriesLabel,
    todayStr, dayNum, dayStr, addDays, monthKey, monthStart, monthEnd, fmtDay, fmtMonth, MONTHS,
    active, buildDays, dayValue, dayGroupValue, seriesPoints, episodes, bleedingDaySet, MERGE_GAP,

  else root.Core = api;
})(this);

<script>/* Storage on the phone (IndexedDB) and cloud sync (Supabase REST, no SDK). */
(function (root) {
  'use strict';
  const DB_NAME = 'estelle-endo-tracker';
  const DB_VERSION = 1;
  let db = null;

  function open() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = () => {
        const d = req.result;
        if (!d.objectStoreNames.contains('records')) d.createObjectStore('records', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'key' });
      };
      req.onsuccess = () => { db = req.result; resolve(db); };
      req.onerror = () => reject(req.error || new Error('Could not open storage'));
      req.onblocked = () => reject(new Error('Storage is busy in another tab'));
    });
  }
  function tx(store, mode, fn) {
    return new Promise((resolve, reject) => {
      const t = db.transaction(store, mode);
      let result;
      t.oncomplete = () => resolve(result);
      t.onerror = () => reject(t.error || new Error('Storage error'));
      t.onabort = () => reject(t.error || new Error('Storage write was aborted'));
      result = fn(t.objectStore(store));
    });
  }
  function getAll(store) {
    return new Promise((resolve, reject) => {
      const req = db.transaction(store).objectStore(store).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  }

  const Store = {
    records: new Map(),
    meta: {},
    async init() {
      await open();
      const recs = await getAll('records');
      recs.forEach(r => this.records.set(r.id, r));
      const metas = await getAll('meta');
      metas.forEach(m => { this.meta[m.key] = m.value; });
      try { if (navigator.storage && navigator.storage.persist) this.persisted = await navigator.storage.persist(); } catch (e) { /* optional */ }
    },
    list() { return [...this.records.values()]; },
    // Writes go to IndexedDB first; memory is only updated after the write succeeds.
    async putMany(recs) {
      if (!recs.length) return;
      await tx('records', 'readwrite', s => recs.forEach(r => s.put(r)));
      recs.forEach(r => this.records.set(r.id, r));
    },
    async save(kind, id, data, opts) {
      const now = new Date().toISOString();
      const prev = this.records.get(id);
      const rec = {
        id, kind, data,
        createdAt: prev ? prev.createdAt : now,
        updatedAt: now,
        deleted: false,
        demo: !!(opts && opts.demo) || !!(prev && prev.demo),
        dirty: true
      };
      if (rec.demo) rec.dirty = false;
      await this.putMany([rec]);
      return rec;
    },
    // Several records written in one transaction: all are saved, or none are.
    async saveMany(kind, items) {
      const now = new Date().toISOString();
      const recs = items.map(({ id, data }) => {
        const prev = this.records.get(id);
        return { id, kind, data, createdAt: prev ? prev.createdAt : now, updatedAt: now, deleted: false, demo: false, dirty: true };
      });
      await this.putMany(recs);
      return recs;
    },
    // Deletes become tombstones (content removed) so the deletion syncs to the cloud.
    async remove(id) {
      const prev = this.records.get(id);
      if (!prev) return;
      if (prev.demo) { await tx('records', 'readwrite', s => s.delete(id)); this.records.delete(id); return; }
      const rec = Object.assign({}, prev, { data: {}, deleted: true, updatedAt: new Date().toISOString(), dirty: true });
      await this.putMany([rec]);
    },
    async hardDelete(ids) {
      await tx('records', 'readwrite', s => ids.forEach(id => s.delete(id)));
      ids.forEach(id => this.records.delete(id));
    },
    async clearAll() {
      await tx('records', 'readwrite', s => s.clear());
      this.records.clear();
    },
    async setMeta(key, value) {
      await tx('meta', 'readwrite', s => s.put({ key, value }));
      this.meta[key] = value;
    }
  };

  // ---------- Cloud (Supabase) ----------
  const Cloud = {
    status: { state: 'local', message: '' },
    busy: false,
    listeners: [],
    onChange(fn) { this.listeners.push(fn); },
    set(state, message) { this.status = { state, message }; this.listeners.forEach(f => f(this.status)); },
    cfg() { return Store.meta.cloud || null; },
    session() { return Store.meta.session || null; },
    configured() { const c = this.cfg(); return !!(c && c.url && c.key); },
    signedIn() { return !!this.session(); },
    base() { return this.cfg().url.replace(/\/+$/, ''); },

    async authCall(path, body) {
      let res;
      try {
        res = await fetch(this.base() + '/auth/v1/' + path, {
          method: 'POST',
          headers: { 'apikey': this.cfg().key, 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
      } catch (e) { throw new Error('Could not reach the cloud database. Check the Project URL and your connection.'); }
      let json = {};
      try { json = await res.json(); } catch (e) { /* empty */ }
      if (!res.ok) throw new Error(json.error_description || json.msg || json.message || json.error || ('Error ' + res.status));
      return json;
    },
    async storeSession(json) {
      if (!json.access_token) return null;
      const s = {
        access_token: json.access_token,
        refresh_token: json.refresh_token,
        expires_at: json.expires_at || (Math.floor(Date.now() / 1000) + (json.expires_in || 3600)),
        user: { id: json.user && json.user.id, email: json.user && json.user.email }
      };
      await Store.setMeta('session', s);
      return s;
    },
    async signUp(email, password) {
      const json = await this.authCall('signup', { email, password });
      const s = await this.storeSession(json);
      return { session: s };
    },
    async signIn(email, password) {
      const json = await this.authCall('token?grant_type=password', { email, password });
      return this.storeSession(json);
    },
    async signOut() { await Store.setMeta('session', null); this.set('signed-out', 'Signed out of the cloud. New entries are saved on this phone only.'); },
    async token(force) {
      const s = this.session();
      if (!s) throw Object.assign(new Error('Not signed in'), { auth: true });
      if (!force && s.expires_at - 60 > Date.now() / 1000) return s.access_token;
      try {
        const json = await this.authCall('token?grant_type=refresh_token', { refresh_token: s.refresh_token });
        const ns = await this.storeSession(json);
        return ns.access_token;
      } catch (e) {
        if (/reach the cloud/.test(e.message)) throw e;
        await Store.setMeta('session', null);
        throw Object.assign(new Error('Your cloud sign-in expired. Sign in again on the Data tab. Entries are safe on this phone.'), { auth: true });
      }
    },
    async rest(method, query, body, extraHeaders, retried) {
      const tok = await this.token();
      let res;
      try {
        res = await fetch(this.base() + '/rest/v1/records' + query, {
          method,
          headers: Object.assign({ 'apikey': this.cfg().key, 'Authorization': 'Bearer ' + tok, 'Content-Type': 'application/json' }, extraHeaders || {}),
          body: body ? JSON.stringify(body) : undefined
        });
      } catch (e) { throw new Error('No connection to the cloud right now.'); }
      if (res.status === 401 && !retried) { await this.token(true); return this.rest(method, query, body, extraHeaders, true); }
      if (!res.ok) {
        let msg = 'Cloud error ' + res.status;
        try { const j = await res.json(); msg = j.message || j.msg || msg; if (j.code === '42P01' || /relation .* does not exist|Could not find the table/i.test(msg)) msg = 'The cloud table is missing. Run the setup SQL in Supabase (see the setup guide).'; } catch (e) { /* ignore */ }
        throw new Error(msg);
      }
      if (method === 'GET') return res.json();
      return null;
    },
    async pullAll() {
      const rows = [];
      for (let offset = 0; ; offset += 1000) {
        const page = await this.rest('GET', '?select=*&order=id.asc&limit=1000&offset=' + offset);
        rows.push(...page);
        if (page.length < 1000) break;
      }
      return rows;
    },
    async sync() {
      if (!this.configured()) { this.set('local', 'Saved on this phone only. Cloud backup is not set up.'); return; }
      if (!this.signedIn()) { this.set('signed-out', 'Saved on this phone. Sign in to the cloud to sync.'); return; }
      if (this.busy) { this.again = true; return; }
      this.busy = true;
      this.set('syncing', 'Syncing…');
      try {
        const remote = await this.pullAll();
        const puts = Core.mergeRemote(Store.records, remote);
        await Store.putMany(puts);
        const dirty = Store.list().filter(r => r.dirty && !r.demo);
        const userId = this.session().user.id;
        for (let i = 0; i < dirty.length; i += 200) {
          const batch = dirty.slice(i, i + 200);
          await this.rest('POST', '?on_conflict=id', batch.map(r => Core.toRemote(r, userId)), { 'Prefer': 'resolution=merge-duplicates,return=minimal' });
          // Only clear the flag if the record wasn't edited again while uploading.
          const done = batch.map(r => Store.records.get(r.id)).filter(cur => cur && cur.updatedAt === batch.find(b => b.id === cur.id).updatedAt)
            .map(cur => Object.assign({}, cur, { dirty: false }));
          await Store.putMany(done);
        }
        await Store.setMeta('lastSync', new Date().toISOString());
        const left = Store.list().filter(r => r.dirty && !r.demo).length;
        this.set(left ? 'pending' : 'synced', left ? left + ' change(s) waiting to sync' : 'Saved on this phone and in the cloud.');
        return { pulled: puts.length };
      } catch (e) {
        const pending = Store.list().filter(r => r.dirty && !r.demo).length;
        this.set(e.auth ? 'signed-out' : 'error', e.message + (pending ? ' ' + pending + ' change(s) are saved on this phone and will sync later.' : ''));
      } finally {
        this.busy = false;
        if (this.again) { this.again = false; setTimeout(() => this.sync(), 50); }
      }
    },
    async deleteAllRemote() {
      const s = this.session();
      if (!s) throw new Error('Not signed in to the cloud');
      await this.rest('DELETE', '?user_id=eq.' + encodeURIComponent(s.user.id), null, { 'Prefer': 'return=minimal' });
    }
  };

  root.Store = Store;
  root.Cloud = Cloud;
})(this);
</script>
<script>/* Small SVG chart renderers. Colours are passed in resolved (not CSS vars)
   so the same SVG can be saved as a PNG image. */
(function (root) {
  'use strict';
  const C = root.Core;
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function geom(width, height, from, to) {
    const ml = 30, mr = 10, mt = 14, mb = 40;
    const a = C.dayNum(from), b = C.dayNum(to);
    const span = Math.max(1, b - a);
    const pw = width - ml - mr, ph = height - mt - mb;
    return {
      ml, mr, mt, mb, pw, ph, a, b, span,
      x: n => ml + (n - a) / span * pw,
      y: v => mt + ph - v / 10 * ph,
      n: px => Math.round(a + (px - ml) / pw * span)
    };
  }

  function xTicks(g) {
    const ticks = [];
    if (g.span <= 45) {
      const step = g.span <= 14 ? 2 : 7;
      for (let n = g.a; n <= g.b; n += step) ticks.push({ n, label: C.fmtDay(C.dayStr(n)) });
    } else {
      const every = g.span <= 220 ? 1 : g.span <= 500 ? 2 : 3;
      let mk = C.monthKey(C.dayStr(g.a));
      let i = 0;
      while (true) {
        const n = C.dayNum(C.monthStart(mk));
        if (n > g.b) break;
        if (n >= g.a && i % every === 0) {
          const [y, m] = mk.split('-').map(Number);
          ticks.push({ n, label: C.MONTHS[m - 1] + (m === 1 ? ' ' + String(y).slice(2) : '') });
        }
        if (n >= g.a) i++;
        const [y, m] = mk.split('-').map(Number);
        mk = m === 12 ? (y + 1) + '-01' : y + '-' + String(m + 1).padStart(2, '0');
      }
    }
    return ticks;
  }

  function lineChart(o) {
    const { width, height, from, to, series, bands, markers, logged, selected, col } = o;
    const g = geom(width, height, from, to);
    const parts = [];
    parts.push(`<rect x="0" y="0" width="${width}" height="${height}" fill="${col.surface}"/>`);
    // bleeding bands
    for (const [s, e] of (bands || [])) {
      const x1 = g.x(Math.max(s, g.a) - 0.5), x2 = g.x(Math.min(e, g.b) + 0.5);
      if (x2 <= g.ml || x1 >= g.ml + g.pw) continue;
      parts.push(`<rect x="${Math.max(g.ml, x1).toFixed(1)}" y="${g.mt}" width="${(Math.min(g.ml + g.pw, x2) - Math.max(g.ml, x1)).toFixed(1)}" height="${g.ph}" fill="${col.band}"/>`);
    }
    // grid + y labels
    for (const v of [0, 5, 10]) {
      const y = g.y(v).toFixed(1);
      parts.push(`<line x1="${g.ml}" x2="${g.ml + g.pw}" y1="${y}" y2="${y}" stroke="${v === 0 ? col.axis : col.grid}" stroke-width="1"/>`);
      parts.push(`<text x="${g.ml - 8}" y="${+y + 4}" text-anchor="end" font-size="11" fill="${col.muted}">${v}</text>`);
    }
    // x ticks
    for (const t of xTicks(g)) {
      const x = g.x(t.n).toFixed(1);
      parts.push(`<line x1="${x}" x2="${x}" y1="${g.mt + g.ph}" y2="${g.mt + g.ph + 4}" stroke="${col.axis}"/>`);
      parts.push(`<text x="${x}" y="${g.mt + g.ph + 16}" text-anchor="middle" font-size="11" fill="${col.muted}">${esc(t.label)}</text>`);
    }
    // logging coverage row
    const cy = g.mt + g.ph + 24;
    const cw = Math.max(1.5, g.pw / (g.span + 1) - 0.5);
    parts.push(`<text x="${g.ml - 8}" y="${cy + 6}" text-anchor="end" font-size="9" fill="${col.muted}">log</text>`);
    parts.push(`<rect x="${g.ml}" y="${cy}" width="${g.pw}" height="7" rx="2" fill="${col.grid}"/>`);
    for (const n of (logged || [])) {
      if (n < g.a || n > g.b) continue;
      parts.push(`<rect x="${(g.x(n) - cw / 2).toFixed(1)}" y="${cy}" width="${cw.toFixed(1)}" height="7" fill="${col.logged}"/>`);
    }
    // markers (notes, medication changes)
    for (const m of (markers || [])) {
      if (m.n < g.a || m.n > g.b) continue;
      const x = g.x(m.n);
      parts.push(`<path d="M${(x - 4).toFixed(1)} 2 L${(x + 4).toFixed(1)} 2 L${x.toFixed(1)} 9 Z" fill="${col.marker}"><title>${esc(m.label)}</title></path>`);
    }
    // selected day
    if (selected !== undefined && selected !== null && selected >= g.a && selected <= g.b) {
      const x = g.x(selected).toFixed(1);
      parts.push(`<line x1="${x}" x2="${x}" y1="${g.mt}" y2="${g.mt + g.ph}" stroke="${col.text}" stroke-width="1" stroke-dasharray="3 3"/>`);
    }
    // series: lines join consecutive calendar days only
    series.forEach(s => {
      const pts = s.points.filter(p => p.value !== null);
      let d = '';
      for (let i = 0; i < pts.length; i++) {
        const p = pts[i], prev = pts[i - 1];
        const cmd = prev && p.n - prev.n === 1 ? 'L' : 'M';
        d += cmd + g.x(p.n).toFixed(1) + ' ' + g.y(p.value).toFixed(1) + ' ';
      }
      if (d) parts.push(`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"${s.dash ? ` stroke-dasharray="${s.dash}"` : ''}/>`);
      for (const p of pts) {
        const x = g.x(p.n).toFixed(1), y = g.y(p.value).toFixed(1);
        if (p.implied) parts.push(`<circle cx="${x}" cy="${y}" r="3.5" fill="${col.surface}" stroke="${s.color}" stroke-width="1.5"/>`);
        else parts.push(`<circle cx="${x}" cy="${y}" r="4" fill="${s.color}" stroke="${col.surface}" stroke-width="1.5"/>`);
      }
    });
    if (o.emptyText) parts.push(`<text x="${g.ml + g.pw / 2}" y="${g.mt + g.ph / 2}" text-anchor="middle" font-size="13" fill="${col.muted}">${esc(o.emptyText)}</text>`);
    const title = o.title ? `<title>${esc(o.title)}</title>` : '';
    return `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" font-family="-apple-system, system-ui, sans-serif" role="img">${title}${parts.join('')}</svg>`;
  }

  function barChart(o) {
    const { width, height, items, col } = o; // items: {label, value|null, sub}
    const ml = 26, mr = 6, mt = 18, mb = 34;
    const pw = width - ml - mr, ph = height - mt - mb;
    const y = v => mt + ph - v / 10 * ph;
    const parts = [`<rect x="0" y="0" width="${width}" height="${height}" fill="${col.surface}"/>`];
    for (const v of [0, 5, 10]) {
      parts.push(`<line x1="${ml}" x2="${ml + pw}" y1="${y(v)}" y2="${y(v)}" stroke="${v === 0 ? col.axis : col.grid}"/>`);
      parts.push(`<text x="${ml - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="${col.muted}">${v}</text>`);
    }
    const n = items.length || 1;
    const slot = pw / n, bw = Math.min(28, slot * 0.6);
    items.forEach((it, i) => {
      const cx = ml + slot * (i + 0.5);
      if (it.value !== null && it.value !== undefined) {
        const top = y(it.value), h = Math.max(0, mt + ph - top);
        const r = Math.min(4, h);
        parts.push(`<path d="M${cx - bw / 2} ${mt + ph} V${top + r} Q${cx - bw / 2} ${top} ${cx - bw / 2 + r} ${top} H${cx + bw / 2 - r} Q${cx + bw / 2} ${top} ${cx + bw / 2} ${top + r} V${mt + ph} Z" fill="${col.bar}"/>`);
        parts.push(`<text x="${cx}" y="${top - 5}" text-anchor="middle" font-size="11" fill="${col.text}">${it.value.toFixed(1)}</text>`);
      } else {
        parts.push(`<text x="${cx}" y="${mt + ph - 6}" text-anchor="middle" font-size="10" fill="${col.muted}">no data</text>`);
      }
      parts.push(`<text x="${cx}" y="${mt + ph + 14}" text-anchor="middle" font-size="11" fill="${col.text}">${esc(it.label)}</text>`);
      parts.push(`<text x="${cx}" y="${mt + ph + 27}" text-anchor="middle" font-size="9.5" fill="${col.muted}">${esc(it.sub || '')}</text>`);
    });
    return `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" font-family="-apple-system, system-ui, sans-serif" role="img"><title>${esc(o.title || '')}</title>${parts.join('')}</svg>`;
  }

  // SVG string -> PNG Blob (2x)
  function svgToPng(svg, width, height) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = width * 2; c.height = height * 2;
        const ctx = c.getContext('2d');
        ctx.scale(2, 2);
        ctx.drawImage(img, 0, 0, width, height);
        c.toBlob(b => b ? resolve(b) : reject(new Error('Could not create image')), 'image/png');
      };
      img.onerror = () => reject(new Error('Could not draw image'));
      img.src = url;
    });
  }

  root.Charts = { lineChart, barChart, geom, svgToPng };
})(this);
</script>
<script>/* Estelle's tracker: UI */
(function () {

  const C = window.Core, Store = window.Store, Cloud = window.Cloud, Charts = window.Charts;

  // ---------- helpers ----------
  const $ = (s, el) => (el || document).querySelector(s);
  const $$ = (s, el) => [...(el || document).querySelectorAll(s)];
  const esc = s => String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = crypto.getRandomValues(new Uint8Array(1))[0] % 16; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));
  const today = () => C.todayStr();
  const nowTime = () => { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
  const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const fmtDate = d => { const n = C.dayNum(d), t = C.dayNum(today()); if (n === t) return 'Today'; if (n === t - 1) return 'Yesterday'; return weekday(d) + ' ' + C.fmtDay(d, d.slice(0, 4) !== today().slice(0, 4)); };
  const weekday = d => ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][new Date(C.dayNum(d) * 86400000).getUTCDay()];
  const fmtStamp = iso => { if (!iso) return ''; const d = new Date(iso); return C.fmtDay(C.todayStr(d), true) + ', ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
  const lsGet = (k, def) => { try { const v = localStorage.getItem('etr.' + k); return v ? JSON.parse(v) : def; } catch (e) { return def; } };
  const lsSet = (k, v) => { try { localStorage.setItem('etr.' + k, JSON.stringify(v)); } catch (e) { /* not essential */ } };

  const ICON = {
    home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>',
    history: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>',

    graph: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16M5 15l4-5 4 3 6-7"/></svg>',
    pattern: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="7" r="2.5"/><circle cx="7" cy="17" r="2.5"/><circle cx="17" cy="17" r="2.5"/></svg>',
    data: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg>',
    close: '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    drop: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>',
