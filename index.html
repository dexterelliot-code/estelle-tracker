    calm: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5c1 1.2 2.1 1.8 3.5 1.8s2.5-.6 3.5-1.8M9 10h.01M15 10h.01"/></svg>'
  };

  // ---------- state ----------
  const S = Object.assign({
    tab: 'home',
    range: { preset: '90', from: null, to: null },
    aKeys: ['pelvic', 'ovary_r', 'ovary_l'], aSlots: {},
    bMood: ['low_mood', 'anxiety'], bMoodSlots: {},
    bPhys: ['pelvic', 'bloating', 'fatigue', 'nausea'], bPhysSlots: {},
    cTarget: 'all',
    pRange: 'all',
    hist: { q: '', kind: 'all', order: 'desc' }
  }, lsGet('ui', {}));
  S.sel = { a: null, b: null };
  S.histLimit = 60;
  const saveUI = () => lsSet('ui', { tab: S.tab, range: S.range, aKeys: S.aKeys, aSlots: S.aSlots, bMood: S.bMood, bMoodSlots: S.bMoodSlots, bPhys: S.bPhys, bPhysSlots: S.bPhysSlots, cTarget: S.cTarget, pRange: S.pRange, hist: S.hist });

  const settings = () => Object.assign({ name: 'Estelle', dienogestDose: '', showDemo: true }, Store.meta.settings || {});
  const recs = () => C.active(Store.list(), settings().showDemo);
  const hasDemo = () => Store.list().some(r => r.demo);

  function rangeDates() {
    const t = today();
    const r = S.range;
    if (r.preset === 'custom' && r.from && r.to) return r.from <= r.to ? [r.from, r.to] : [r.to, r.from];
    const days = { '30': 29, '90': 89, '180': 182, '365': 364 }[r.preset] || 89;
    return [C.addDays(t, -days), t];
  }

  function assignSlots(keys, slots) {
    const used = new Set(keys.filter(k => slots[k] !== undefined).map(k => slots[k]));
    for (const k of Object.keys(slots)) if (!keys.includes(k)) delete slots[k];
    for (const k of keys) if (slots[k] === undefined) { let s = 0; while (used.has(s)) s++; slots[k] = s; used.add(s); }
    return slots;
  }
  const seriesColor = slot => css('--series-' + (slot % 8 + 1));
  const chartColors = () => ({ surface: css('--chart-surface'), grid: css('--chart-grid'), axis: css('--chart-axis'), muted: css('--chart-muted'), text: css('--text'), band: css('--chart-band'), logged: css('--chart-logged'), marker: css('--chart-marker'), bar: css('--chart-bar') });

  // ---------- toast ----------
  let toastTimer;
  function toast(msg, action) {
    let t = $('#toast');
    if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
    t.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button type="button" id="toast-act">${esc(action.label)}</button>` : '');
    t.classList.remove('hidden');
    if (action) $('#toast-act').onclick = () => { t.classList.add('hidden'); action.fn(); };
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.add('hidden'), action ? 6000 : 3000);
  }

  // ---------- sheet ----------
  let sheetState = null;
  function openSheet({ title, body, footer, onClose, isDirty }) {
    closeSheet(true);
    const tt = $('#toast'); if (tt) tt.classList.add('hidden');
    const wrap = document.createElement('div');
    wrap.className = 'sheet-wrap';
    wrap.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="sheet-h"><h2>${esc(title)}</h2><button class="icon-btn" data-act="sheet-close" aria-label="Close">${ICON.close}</button></div>
      <div class="sheet-b" id="sheet-b">${body}</div>
      ${footer ? `<div class="sheet-f" id="sheet-f">${footer}</div>` : ''}
    </div>`;
    document.body.appendChild(wrap);
    document.body.style.overflow = 'hidden';
    sheetState = { wrap, onClose, isDirty };
    return wrap;
  }
  function closeSheet(force) {
    if (!sheetState) return true;
    if (!force && sheetState.isDirty && sheetState.isDirty() && !confirm('Close without saving? Your changes will be lost.')) return false;
    sheetState.wrap.remove();
    document.body.style.overflow = '';
    const cb = sheetState.onClose;
    sheetState = null;
    if (cb) cb();
    return true;
  }

  // ---------- rendering ----------
  function render() {
    const app = $('#app');
    const banners = renderBanners();
    let html = '';
    if (S.tab === 'home') html = renderHome();
    else if (S.tab === 'history') html = renderHistory();
    else if (S.tab === 'graphs') html = renderGraphs();
    else if (S.tab === 'patterns') html = renderPatterns();
    else if (S.tab === 'data') html = renderData();
    app.innerHTML = banners + html;
    renderTabbar();
    requestAnimationFrame(drawCharts);
  }

  function renderTabbar() {
    const tabs = [['home', 'Overview', ICON.home], ['history', 'History', ICON.history], ['log', 'Log', ICON.plus], ['graphs', 'Graphs', ICON.graph], ['patterns', 'Patterns', ICON.pattern]];
    $('#tabbar').innerHTML = `<div class="tabbar-in">${tabs.map(([id, label, ic]) => id === 'log'
      ? `<button class="tab log" data-act="log" aria-label="Log symptoms"><span class="circle">${ic}</span>Log</button>`
      : `<button class="tab" data-act="tab" data-tab="${id}" ${S.tab === id ? 'aria-current="page"' : ''}>${ic}${label}</button>`).join('')}</div>`;
  }

  function syncPill() {
    const st = Cloud.status;
    const map = { synced: ['ok', 'Synced'], pending: ['warn', 'Waiting to sync'], syncing: ['', 'Syncing…'], error: ['err', 'Sync problem'], 'signed-out': ['warn', 'Cloud: signed out'], local: ['warn', 'Phone only'] };
    const [cls, label] = map[st.state] || ['', st.state];
    return `<button class="pill ${cls}" data-act="tab" data-tab="data" title="${esc(st.message)}"><span class="dot"></span>${label}</button>`;
  }

  function headActions() {
    return `<div class="head-actions">${syncPill()}<button class="icon-btn" data-act="tab" data-tab="data" aria-label="Data and backup" ${S.tab === 'data' ? 'aria-current="page"' : ''}>${ICON.data}</button></div>`;
  }
  function renderBanners() {
    let h = '';
    if (Store.failed) h += `<div class="banner err">Storage on this phone could not be opened: ${esc(Store.failed)}. Entries cannot be saved until this is fixed. Try closing other tabs of this app, or check Safari isn't in Private mode.</div>`;
    if (hasDemo()) h += `<div class="banner warn"><span><span class="demo-tag">DEMO</span> Demonstration data is ${settings().showDemo ? 'showing' : 'stored but hidden'}. It's kept separate from real entries.</span><button class="link-btn" data-act="tab" data-tab="data">Manage</button></div>`;
    if (Cloud.status.state === 'error' || Cloud.status.state === 'signed-out') {
      if (Cloud.configured()) h += `<div class="banner ${Cloud.status.state === 'error' ? 'err' : 'warn'}"><span>${esc(Cloud.status.message)}</span><button class="link-btn" data-act="tab" data-tab="data">Fix</button></div>`;
    }
    return h;
  }

  // ---------- Overview ----------
  function renderHome() {
    const st = settings();
    const h = new Date().getHours();
    const greet = h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
    const all = recs();
    const { days } = C.buildDays(all);
    const t = today();
    const bleed = C.bleedingDaySet(all, t);
    let cells = '', labels = '';
    for (let i = 13; i >= 0; i--) {
      const d = C.addDays(t, -i);
      const day = days.get(d);
      const g = C.dayGroupValue(day, null);
      let cls = 'cell', style = '', title;
      if (!day) { cls += ' unk'; title = 'Not logged (unknown)'; }
      else if (typeof g.value === 'number') { const b = g.value === 0 ? 0 : Math.min(5, Math.ceil(g.value / 2)); style = `background:var(--seq-${b})`; title = 'Highest score ' + g.value; }
      else { style = 'background:var(--seq-1)'; title = 'Logged, not scored'; }
      if (i === 0) cls += ' today';
      cells += `<button class="${cls}" style="${style}" data-act="day" data-date="${d}" aria-label="${esc(fmtDate(d) + ': ' + title)}" title="${esc(title)}">${bleed.has(C.dayNum(d)) ? '<span class="bl"></span>' : ''}</button>`;
      labels += `<span>${i % 2 === 1 ? '' : weekday(d).slice(0, 1)}</span>`;
    }
    const recent = all.filter(r => r.kind === 'entry' || r.kind === 'bleeding' || r.kind === 'med' || r.kind === 'note')
      .sort((a, b) => sortKey(b).localeCompare(sortKey(a))).slice(0, 3);
    const ongoing = all.filter(r => r.kind === 'bleeding' && !r.data.endDate);
    const standalone = window.navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
    const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const lastBackup = Store.meta.lastBackup;
    const needBackup = !Cloud.signedIn() && all.some(r => !r.demo) && (!lastBackup || Date.now() - Date.parse(lastBackup) > 30 * 86400000);
    return `
      <div class="screen-head"><div><h1>${greet}, ${esc(st.name || 'Estelle')}</h1><p class="small">${esc(weekday(t) + ' ' + C.fmtDay(t, true))}</p></div>${headActions()}</div>
      ${isIOS && !standalone ? `<div class="banner info"><span>Add this app to your Home Screen: tap <b>Share</b>, then <b>Add to Home Screen</b>. Then always open it from that icon. Safari tabs keep their own separate copy of the data.</span></div>` : ''}
      ${needBackup ? `<div class="banner warn"><span>${lastBackup ? 'Your last backup was over a month ago.' : 'Your entries are only on this phone.'} Set up the cloud or save a backup.</span><button class="link-btn" data-act="tab" data-tab="data">Back up</button></div>` : ''}
      <button class="btn btn-primary btn-block btn-big" data-act="log">${ICON.plus.replace('<svg', '<svg width="24" height="24"')} Log symptoms</button>
      <div class="quick">
        <button class="btn" data-act="no-symptoms">${ICON.calm}No significant symptoms today</button>
        <button class="btn" data-act="bleeding">${ICON.drop}Log bleeding</button>
        <button class="btn" data-act="med">${ICON.pill}Log medication</button>
      </div>
      ${ongoing.map(r => `<div class="banner info" style="margin-top:14px"><span>Bleeding logged since ${esc(C.fmtDay(r.data.startDate, true))} (${esc(r.data.type || 'type not set')}).</span><button class="link-btn" data-act="edit" data-id="${r.id}">Update</button></div>`).join('')}
      <div class="card" style="margin-top:14px">
        <div class="card-head"><h2>Last 14 days</h2><button class="link-btn" data-act="tab" data-tab="graphs">Graphs</button></div>
        <div class="strip">${cells}</div>
        <div class="strip-labels">${labels}</div>
        <div class="legend"><span><span class="box" style="background:var(--seq-0)"></span>0</span><span><span class="box" style="background:var(--seq-2)"></span>3–4</span><span><span class="box" style="background:var(--seq-4)"></span>7–8</span><span><span class="box" style="border:1.5px dashed var(--line)"></span>not logged</span><span><span class="box" style="background:var(--series-8);border-radius:50%;width:8px;height:8px"></span>bleeding</span></div>
        <p class="small" style="margin:8px 0 0">Each square shows the highest score recorded that day. Tap a day to see or add entries.</p>
      </div>
      <div class="card">
        <div class="card-head"><h2>Recent</h2><button class="link-btn" data-act="tab" data-tab="history">See all</button></div>
        ${recent.length ? recent.map(itemCard).join('') : `<p class="small">Nothing logged yet. When something comes up, tap <b>Log symptoms</b>. There's no daily check-in to keep up with.</p>`}
      </div>`;
  }

  // ---------- items ----------
  function sortKey(r) {
    const d = r.data || {};
    const date = r.kind === 'bleeding' ? d.startDate : d.date;
    return (date || '') + 'T' + (d.time || '') + '|' + r.createdAt;
  }
  function recDate(r) { return r.kind === 'bleeding' ? r.data.startDate : r.data.date; }
  function symTags(d) {
    const { labels } = { labels: {} };
    return (d.symptoms || []).map(s => {
      const key = C.seriesKey(s);
      const sev = s.severity === null || s.severity === undefined ? '?' : s.severity;
      return `<span class="sym-tag">${esc(C.seriesLabel(key, s.label ? { [key]: s.label } : labels))} <b>${sev}</b></span>`;
    }).join('');
  }
  const MED_EVENT = { taken: 'Taken', missed: 'Missed dose', change: 'Dose change', started: 'Started', stopped: 'Stopped' };
  const MED_CAT = { dienogest: 'Dienogest', pain: 'Pain relief', ec: 'Emergency contraception', hormonal: 'Other hormonal', other: 'Other' };
  function itemCard(r) {
    const d = r.data;
    const demo = r.demo ? ' <span class="demo-tag">DEMO</span>' : '';
    if (r.kind === 'entry') {
      const title = d.noSymptoms ? 'No significant symptoms' : ((d.symptoms || []).length + ' symptom' + ((d.symptoms || []).length === 1 ? '' : 's'));
      return `<button class="item" data-act="edit" data-id="${r.id}"><div class="item-top"><span><span class="kind-ico" style="background:var(--accent)"></span>Symptoms${demo}</span><span>${esc(d.time || '')}</span></div>
        <div class="item-title">${esc(title)}${d.duration ? ` <span class="small">· ${esc(d.duration)}</span>` : ''}</div>
        ${d.noSymptoms ? '' : `<div class="sym-list">${symTags(d)}</div>`}
        ${d.notes ? `<div class="note">${esc(d.notes.length > 160 ? d.notes.slice(0, 160) + '…' : d.notes)}</div>` : ''}</button>`;
    }
    if (r.kind === 'bleeding') {
      return `<button class="item" data-act="edit" data-id="${r.id}"><div class="item-top"><span><span class="kind-ico" style="background:var(--series-8)"></span>Bleeding${demo}</span><span>${d.endDate ? esc(C.fmtDay(d.startDate) + ' – ' + C.fmtDay(d.endDate)) : 'ongoing'}</span></div>
        <div class="item-title">${esc(cap(d.type || 'Type not set'))}${d.pain !== null && d.pain !== undefined && d.pain !== '' ? ` · pain ${esc(d.pain)}` : ''}</div>
        ${d.symptoms ? `<div class="note">${esc(d.symptoms)}</div>` : ''}${d.notes ? `<div class="note">${esc(d.notes)}</div>` : ''}</button>`;
    }
    if (r.kind === 'med') {
      return `<button class="item" data-act="edit" data-id="${r.id}"><div class="item-top"><span><span class="kind-ico" style="background:var(--series-7)"></span>Medication${demo}</span><span>${esc(d.time || '')}</span></div>
        <div class="item-title">${esc(MED_EVENT[d.event] || 'Taken')}: ${esc(d.name || MED_CAT[d.category] || '')}${d.dose ? ' · ' + esc(d.dose) : ''}</div>
        ${d.effect ? `<div class="note">Effect: ${esc(d.effect)}</div>` : ''}${d.sideEffects ? `<div class="note">Side effects: ${esc(d.sideEffects)}</div>` : ''}${d.notes ? `<div class="note">${esc(d.notes)}</div>` : ''}</button>`;
    }
    if (r.kind === 'note') {
      return `<button class="item" data-act="edit" data-id="${r.id}"><div class="item-top"><span><span class="kind-ico" style="background:var(--chart-marker)"></span>${d.tag === 'pattern' ? 'Suspected pattern' : 'Note'}${demo}</span><span></span></div><div class="note" style="color:var(--text)">${esc(d.text)}</div></button>`;
    }
    return '';
  }
  const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;

  // ---------- History ----------
  function searchText(r) {
    const d = r.data;
    let s = [d.notes, d.text, d.duration, d.name, d.dose, d.effect, d.sideEffects, d.symptoms && typeof d.symptoms === 'string' ? d.symptoms : '', d.type, MED_CAT[d.category], MED_EVENT[d.event]].join(' ');
    if (Array.isArray(d.symptoms)) s += ' ' + d.symptoms.map(x => C.seriesLabel(C.seriesKey(x), x.label ? { [C.seriesKey(x)]: x.label } : {})).join(' ');
    if (d.noSymptoms) s += ' no significant symptoms';
    if (d.context) s += ' ' + Object.values(d.context).join(' ');
    return s.toLowerCase();
  }
  function renderHistory() {
    const H = S.hist;
    let list = recs();
    if (H.kind !== 'all') list = list.filter(r => r.kind === H.kind);
    const q = H.q.trim().toLowerCase();
    if (q) list = list.filter(r => searchText(r).includes(q));
    list.sort((a, b) => H.order === 'desc' ? sortKey(b).localeCompare(sortKey(a)) : sortKey(a).localeCompare(sortKey(b)));
    const total = list.length;
    list = list.slice(0, S.histLimit);
    let html = '', lastDate = null;
    for (const r of list) {
      const d = recDate(r);
      if (d !== lastDate) { html += `<div class="day-h">${esc(fmtDate(d))}</div>`; lastDate = d; }
      html += itemCard(r);
    }
    const kinds = [['all', 'All'], ['entry', 'Symptoms'], ['bleeding', 'Bleeding'], ['med', 'Medication'], ['note', 'Notes']];
    return `
      <div class="screen-head"><div><h1>History</h1><p class="small">${total} record${total === 1 ? '' : 's'}${q ? ' matching' : ''}</p></div>${headActions()}</div>
      <input class="field" type="search" placeholder="Search symptoms, notes, medication…" value="${esc(H.q)}" data-in="hist-q" aria-label="Search history">
      <div class="chips" style="margin-top:10px">${kinds.map(([k, l]) => `<button class="chip" data-act="hist-kind" data-kind="${k}" aria-pressed="${H.kind === k}">${l}</button>`).join('')}
        <button class="chip" data-act="hist-order">${H.order === 'desc' ? 'Newest first ↓' : 'Oldest first ↑'}</button></div>
      <div id="hist-list">${html || `<p class="small" style="margin-top:20px">No records${q || H.kind !== 'all' ? ' match these filters' : ' yet'}.</p>`}</div>
      ${total > list.length ? `<button class="btn btn-block" data-act="hist-more">Show more (${total - list.length} left)</button>` : ''}`;
  }

  // ---------- Entry form ----------
  let F = null;
  function usualKeys() {
    const counts = {};
    for (const r of Store.list()) if (r.kind === 'entry' && !r.deleted && !r.demo) for (const s of (r.data.symptoms || [])) { const it = C.ITEM[s.id]; if (it && !it.custom) counts[s.id] = (counts[s.id] || 0) + 1; }
    return Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 8).map(x => x[0]);
  }
  function openEntry(rec, presetDate) {
    const base = { date: presetDate || today(), time: presetDate && presetDate !== today() ? '' : nowTime(), symptoms: [], noSymptoms: false, duration: '', notes: '', context: {} };
    const d = rec ? Object.assign(base, JSON.parse(JSON.stringify(rec.data))) : base;
    d.context = d.context || {};
    F = { id: rec ? rec.id : uuid(), kind: 'entry', d, isNew: !rec, rec, saving: false, multi: new Set([d.date]), multiIds: {}, calMonth: C.monthKey(d.date) };
    const usual = usualKeys();
    const ctx = d.context;
    const body = `
      <div class="two" id="e-single"><div><label class="f" for="e-date">Date</label><input class="field" type="date" id="e-date" value="${esc(d.date)}" max="${today()}"></div>
      <div><label class="f" for="e-time">Time (optional)</label><input class="field" type="time" id="e-time" value="${esc(d.time)}"></div></div>
      ${rec ? '' : `<label class="check" style="margin-top:6px"><input type="checkbox" id="e-multi"> Same symptoms on several days</label>
      <div id="multi-cal" class="hidden"></div>`}
      <label class="check"><input type="checkbox" id="e-none" ${d.noSymptoms ? 'checked' : ''}> No significant symptoms</label>
      <div id="sym-area" class="${d.noSymptoms ? 'hidden' : ''}">
        <p class="small" style="margin:6px 0 0">Tap what you're experiencing, then score each one from 0 to 10. Use <b>?</b> if you're not sure.</p>
        ${usual.length >= 3 ? `<div class="group-h">Your usual</div><div class="chips" id="usual">${usual.map(id => chipFor(id)).join('')}</div>` : ''}
        ${C.GROUPS.map(g => `<div class="group-h">${esc(g.label)}</div><div id="grp-${g.id}">${groupBlock(g)}</div>`).join('')}
      </div>
      <label class="f" for="e-duration">How long it lasted (optional)</label>
      <input class="field" id="e-duration" value="${esc(d.duration)}" placeholder="e.g. 2 hours, all day">
      <div class="chips" style="margin-top:8px">${['Under 1 hour', 'A few hours', 'All day', 'Several days'].map(x => `<button class="chip" type="button" data-act="dur" data-v="${x}">${x}</button>`).join('')}</div>
      <label class="f" for="e-notes">Notes (optional)</label>
      <textarea class="field" id="e-notes" placeholder="Anything worth remembering">${esc(d.notes)}</textarea>
      ${rec ? `<label class="f" for="e-later">Add something you remembered later</label><textarea class="field" id="e-later" placeholder="Saved with today's date" style="min-height:60px"></textarea>` : ''}
      <details class="more" ${Object.keys(ctx).some(k => ctx[k] !== '' && ctx[k] !== undefined && ctx[k] !== null) ? 'open' : ''}><summary>Context (optional)</summary>
        <p class="small" style="margin-top:0">Fill in only what feels useful. Nothing here is required.</p>
        <label class="f">Stress or anxiety level</label>${sevRow('ctx-stress', ctx.stress, false)}<div class="sev-anchors"><span>0 calm</span><span>10 extreme</span></div>
        <div class="two" style="margin-top:14px"><div><label class="f" for="c-sleep">Sleep (hours)</label><input class="field" id="c-sleep" type="number" inputmode="decimal" min="0" max="24" step="0.5" value="${esc(ctx.sleepHours)}"></div>
        <div><label class="f">Sleep quality</label>${segRow('ctx-sleepq', [['poor', 'Poor'], ['ok', 'OK'], ['good', 'Good']], ctx.sleepQuality)}</div></div>
        <label class="f">Exercise or activity</label>${segRow('ctx-ex', [['none', 'None'], ['light', 'Light'], ['moderate', 'Moderate'], ['hard', 'Hard']], ctx.exercise)}
        <input class="field" id="c-exnote" style="margin-top:8px" placeholder="What you did (optional)" value="${esc(ctx.exerciseNote)}">
        <label class="f" for="c-move">Unusual movements or stretching</label><input class="field" id="c-move" value="${esc(ctx.movement)}">
        <label class="f" for="c-bowel">Bowel habits</label><input class="field" id="c-bowel" value="${esc(ctx.bowel)}">
        <label class="f">Appetite and hunger</label>${segRow('ctx-app', [['low', 'Low'], ['normal', 'Normal'], ['high', 'High']], ctx.appetite)}
        <label class="f" for="c-food">Food or suspected triggers</label><input class="field" id="c-food" value="${esc(ctx.food)}">
        <label class="f" for="c-ill">Illness</label><input class="field" id="c-ill" value="${esc(ctx.illness)}" placeholder="e.g. cold, stomach bug">
        <label class="f">Sexual activity (only if you want to record it)</label>${segRow('ctx-sex', [['yes', 'Yes'], ['no', 'No']], ctx.sex)}
        <label class="f" for="c-life">Work stress or life events</label><input class="field" id="c-life" value="${esc(ctx.lifeEvents)}">
        <label class="f" for="c-other">Other medication or events</label><input class="field" id="c-other" value="${esc(ctx.other)}">
      </details>
      ${rec ? `<p class="small" style="margin-top:18px">Created ${esc(fmtStamp(rec.createdAt))} · last saved ${esc(fmtStamp(rec.updatedAt))}</p>` : ''}`;
    const footer = `<div class="save-msg hidden" id="save-msg" role="alert"></div><div class="row">${rec ? '<button class="btn btn-danger" data-act="delete" style="flex:0 0 auto">Delete</button>' : ''}<button class="btn btn-primary" data-act="save-entry">Save</button></div>`;
    openSheet({ title: rec ? 'Edit entry' : 'Log symptoms', body, footer });
    F.orig = entrySnapshot();
    sheetState.isDirty = () => F && !F.saved && entrySnapshot() !== F.orig;
  }
  function multiOn() { const m = $('#e-multi'); return !!(m && m.checked); }
  function entrySnapshot() { return JSON.stringify([readEntryForm(), multiOn() ? [...F.multi].sort() : null]); }
  function renderCal() {
    const el = $('#multi-cal');
    if (!el) return;
    const mk = F.calMonth, t = today();
    const [y, m] = mk.split('-').map(Number);
    const first = C.monthStart(mk), last = C.monthEnd(mk);
    const lead = (new Date(Date.UTC(y, m - 1, 1)).getUTCDay() + 6) % 7; // Monday first
    let cells = '';
    for (let i = 0; i < lead; i++) cells += '<span></span>';
    for (let n = C.dayNum(first); n <= C.dayNum(last); n++) {
      const ds = C.dayStr(n), future = ds > t;
      cells += `<button type="button" class="cal-d${ds === t ? ' today' : ''}" data-act="cal-day" data-date="${ds}" aria-pressed="${F.multi.has(ds)}" ${future ? 'disabled' : ''} aria-label="${esc(C.fmtDay(ds, true))}">${Number(ds.slice(8))}</button>`;
    }
    const sel = [...F.multi].sort();
    const canNext = C.monthKey(t) > mk;
    el.innerHTML = `<div class="cal">
      <div class="cal-h"><button type="button" class="icon-btn" data-act="cal-prev" aria-label="Previous month">‹</button><b>${esc(C.fmtMonth(mk))}</b><button type="button" class="icon-btn" data-act="cal-next" aria-label="Next month" ${canNext ? '' : 'disabled'}>›</button></div>
      <div class="cal-g cal-w">${['M', 'T', 'W', 'T', 'F', 'S', 'S'].map(w => `<span>${w}</span>`).join('')}</div>
      <div class="cal-g">${cells}</div>
      <p class="small" style="margin:8px 0 0"><b>${sel.length} day${sel.length === 1 ? '' : 's'} selected</b>${sel.length ? ': ' + esc(sel.map(x => C.fmtDay(x)).join(', ')) : ''}</p>
      <div class="row" style="margin-top:6px">${sel.length >= 2 ? '<button type="button" class="btn btn-small" data-act="cal-fill">Fill in the days between</button>' : ''}${sel.length ? '<button type="button" class="btn btn-small" data-act="cal-clear">Clear</button>' : ''}</div>
      <p class="small" style="margin:8px 0 0">Tap each day the symptoms happened. Each day is saved as its own entry, so you can edit or delete days separately later.</p>
    </div>`;
  }
  function chipFor(id) {
    const on = F.d.symptoms.some(s => s.id === id);
    return `<button class="chip" type="button" data-act="sym" data-id="${id}" aria-pressed="${on}">${esc(C.ITEM[id].label)}</button>`;
  }
  function groupBlock(g) {
    const sel = F.d.symptoms.filter(s => C.ITEM[s.id] && C.ITEM[s.id].group === g.id);
    const rows = sel.map(s => {
      const it = C.ITEM[s.id];
      const [lo, hi] = C.scaleFor(s.id);
      return `<div class="sym-row" data-row="${s.id}"><div class="sym-row-h"><span>${esc(it.label)}</span><button class="link-btn" type="button" data-act="sym" data-id="${s.id}" aria-label="Remove ${esc(it.label)}">Remove</button></div>
        ${it.custom ? `<input class="field" style="margin-top:8px" data-in="sym-label" data-id="${s.id}" placeholder="Describe it (e.g. shoulder pain)" value="${esc(s.label || '')}">` : ''}
        ${sevRow('sev-' + s.id, s.severity, true)}
        <div class="sev-anchors"><span>0 ${esc(lo)}</span><span>10 ${esc(hi)}</span></div></div>`;
    }).join('');
    const chips = g.items.filter(it => !sel.some(s => s.id === it.id)).map(it => chipFor(it.id)).join('');
    return rows + (chips ? `<div class="chips" style="margin-top:${rows ? 10 : 0}px">${chips}</div>` : '');
  }
  function sevRow(name, val, withUnknown) {
    let h = `<div class="sev" role="group" data-sev="${name}">`;
    for (let i = 0; i <= 10; i++) h += `<button type="button" data-act="sev" data-name="${name}" data-v="${i}" aria-pressed="${val !== null && val !== undefined && val !== '' && Number(val) === i}" aria-label="${i}">${i}</button>`;
    h += withUnknown ? `<button type="button" data-act="sev" data-name="${name}" data-v="?" aria-pressed="${val === null || val === undefined}" aria-label="Not sure / not rated">?</button>` : `<button type="button" data-act="sev" data-name="${name}" data-v="" aria-pressed="${val === '' || val === undefined || val === null}" aria-label="Not recorded">–</button>`;
    return h + '</div>';
  }
  function segRow(name, opts, val) {
    return `<div class="seg" data-seg="${name}">${opts.map(([v, l]) => `<button type="button" data-act="seg" data-name="${name}" data-v="${v}" aria-pressed="${val === v}">${l}</button>`).join('')}</div>`;
  }
  function segVal(name) { const b = $(`[data-seg="${name}"] [aria-pressed="true"]`); return b ? b.dataset.v : ''; }
  function sevVal(name) { const b = $(`[data-sev="${name}"] [aria-pressed="true"]`); if (!b) return ''; return b.dataset.v === '?' ? null : b.dataset.v === '' ? '' : Number(b.dataset.v); }
  function readEntryForm() {
    const d = F.d;
    const out = {
      date: $('#e-date').value, time: $('#e-time').value,
      noSymptoms: $('#e-none').checked,
      symptoms: $('#e-none').checked ? [] : d.symptoms.map(s => { const o = { id: s.id, severity: s.severity === undefined ? null : s.severity }; if (C.ITEM[s.id].custom) o.label = (s.label || '').trim(); return o; }),
      duration: $('#e-duration').value.trim(), notes: $('#e-notes').value,
      context: {}
    };
    const ctx = {
      stress: sevVal('ctx-stress'), sleepHours: $('#c-sleep').value, sleepQuality: segVal('ctx-sleepq'), exercise: segVal('ctx-ex'), exerciseNote: $('#c-exnote').value.trim(),
      movement: $('#c-move').value.trim(), bowel: $('#c-bowel').value.trim(), appetite: segVal('ctx-app'), food: $('#c-food').value.trim(), illness: $('#c-ill').value.trim(),
      sex: segVal('ctx-sex'), lifeEvents: $('#c-life').value.trim(), other: $('#c-other').value.trim()
    };
    for (const k in ctx) if (ctx[k] !== '' && ctx[k] !== null && ctx[k] !== undefined) out.context[k] = k === 'sleepHours' ? Number(ctx[k]) : ctx[k];
    const later = $('#e-later');
    if (later && later.value.trim()) out.notes = (out.notes ? out.notes.replace(/\s+$/, '') + '\n' : '') + '[Added ' + C.fmtDay(today(), true) + '] ' + later.value.trim();
    return out;
  }
  function showSaveMsg(text, kind) {
    const m = $('#save-msg');
    if (!m) return;
    m.className = 'save-msg banner ' + (kind || 'err');
    m.textContent = text;
  }
  async function saveRecord(kind, id, data, done) {
    if (F && F.saving) return;
    if (F) F.saving = true;
    const btn = $('[data-act^="save-"]');
    if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
    try {
      await Store.save(kind, id, data);
      if (F) F.saved = true;
      closeSheet(true);
      if (done) done();
      render();
      toast(Cloud.signedIn() ? 'Saved on this phone. Syncing to the cloud…' : 'Saved on this phone');
      Cloud.sync();
    } catch (e) {
      showSaveMsg('Not saved: ' + (e && e.message ? e.message : 'storage error') + '. Your entry is still here, so you can try again.');
      if (btn) { btn.disabled = false; btn.textContent = 'Save'; }
    } finally { if (F) F.saving = false; }
  }
  async function saveEntry() {
    const d = readEntryForm();
    if (multiOn()) {
      const dates = [...F.multi].filter(x => x <= today()).sort();
      if (!dates.length) return showSaveMsg('Tap at least one day on the calendar.');
      if (!d.noSymptoms && !d.symptoms.length && !d.notes.trim()) return showSaveMsg("Add at least one symptom, tick 'No significant symptoms', or write a note.");
      const unnamedM = d.symptoms.find(s => C.ITEM[s.id].custom && !s.label);
      if (unnamedM) return showSaveMsg('Describe the "' + C.ITEM[unnamedM.id].label + '" you selected.');
      if (F.saving) return;
      F.saving = true;
      const btn = $('[data-act="save-entry"]');
      if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
      try {
        // Ids are fixed per day, so a retry after a failed save never creates duplicates.
        const items = dates.map(date => ({ id: F.multiIds[date] || (F.multiIds[date] = uuid()), data: Object.assign(JSON.parse(JSON.stringify(d)), { date, time: '' }) }));
        await Store.saveMany('entry', items);
        F.saved = true;
        closeSheet(true);
        render();
        toast('Saved for ' + dates.length + ' day' + (dates.length === 1 ? '' : 's') + (Cloud.signedIn() ? '. Syncing…' : ' on this phone'));
        Cloud.sync();
      } catch (e) {
        showSaveMsg('Not saved: ' + (e && e.message ? e.message : 'storage error') + '. Nothing was saved for any of the days, so you can try again.');
        if (btn) { btn.disabled = false; btn.textContent = 'Save'; }
      } finally { F.saving = false; }
      return;
    }
    if (!d.date) return showSaveMsg('Choose a date.');
    if (d.date > today()) return showSaveMsg("The date can't be in the future.");
    if (!d.noSymptoms && !d.symptoms.length && !d.notes.trim()) return showSaveMsg("Add at least one symptom, tick 'No significant symptoms', or write a note.");
    const unnamed = d.symptoms.find(s => C.ITEM[s.id].custom && !s.label);
    if (unnamed) return showSaveMsg('Describe the "' + C.ITEM[unnamed.id].label + '" you selected.');
    saveRecord('entry', F.id, d);
  }

  const LAST = {};
  function buildLineSeries(keys, slots, from, to, days, labels) {

  function chartExtras(all, from, to) {
    const bands = all.filter(r => r.kind === 'bleeding').map(r => [C.dayNum(r.data.startDate), C.dayNum(r.data.endDate || today())]);
    const markers = all.filter(r => (r.kind === 'note') || (r.kind === 'med' && (r.data.event !== 'taken' || r.data.category === 'ec' || r.data.category === 'hormonal')))

    return { bands, markers };
  }
  function legendHtml(series) {
    if (series.length < 2) return series.length ? `<div class="legend"><span><span class="sw" style="background:${series[0].color}"></span>${esc(series[0].label)}</span></div>` : '';
    return `<div class="legend">${series.map(s => `<span><span class="sw" style="background:${s.color}"></span>${esc(s.label)}</span>`).join('')}</div>`;
  }
  function chipsHtml(series, which) {
    return `<div class="chips">${series.map(s => `<button class="chip" data-act="unpick" data-which="${which}" data-key="${esc(s.key)}" aria-label="Remove ${esc(s.label)}"><span class="sw" style="background:${s.color}"></span>${esc(s.label)} ✕</button>`).join('')}</div>`;
  }
  function pickedHtml(n, groups, extras) {
    if (n === null || n === undefined) return `<p class="small" style="margin-top:6px">Tap the chart to see the values for a day.</p>`;
    const date = C.dayStr(n);
    const bleeding = extras.bands.some(([a, b]) => a <= n && n <= b);
    let rows = '';
    for (const series of groups) for (const s of series) {
      const p = s.points.find(x => x.n === n);
      const v = !p ? '<span class="muted">not recorded</span>' : p.unrated ? 'recorded, no score' : p.implied ? '0 <span class="muted">(no significant symptoms)</span>' : String(p.value);
      rows += `<div class="picked-row"><span><span class="legend" style="margin:0;display:inline"><span class="sw" style="background:${s.color}"></span></span>${esc(s.label)}</span><b>${v}</b></div>`;
    }
    return `<div class="picked"><div class="picked-row"><b>${esc(fmtDate(date))}</b>${bleeding ? '<span>Bleeding logged</span>' : ''}</div>${rows}
      <button class="link-btn" data-act="day" data-date="${date}">Open entries for this day</button></div>`;
  }
  function drawCharts() {
    if (S.tab !== 'graphs') return;
    const all = recs();
    const [from, to] = rangeDates();
    const { days, labels } = C.buildDays(all);
    const extras = chartExtras(all, from, to);
    const logged = [...days.keys()].map(C.dayNum);
    const col = chartColors();
    const el = $('#chart-a');
    if (!el) return;
    const width = Math.max(260, Math.floor(el.clientWidth));
    // A
    const sa = buildLineSeries(S.aKeys, S.aSlots, from, to, days, labels);
    const hasA = sa.some(s => s.points.length);
    const svgA = Charts.lineChart({ width, height: 240, from, to, series: sa, bands: extras.bands, markers: extras.markers, logged, selected: S.sel.a, col, title: 'Symptoms over time', emptyText: !sa.length ? 'Choose symptoms to show' : !hasA ? 'Nothing recorded for these in this range' : '' });
    el.innerHTML = svgA;
    $('#chips-a').innerHTML = chipsHtml(sa, 'a');
    $('#picked-a').innerHTML = pickedHtml(S.sel.a, [sa], extras);
    LAST.a = { svg: svgA, width, height: 240, title: 'symptoms-over-time' };
    // B
    const sm = buildLineSeries(S.bMood, S.bMoodSlots, from, to, days, labels);
    const sp = buildLineSeries(S.bPhys, S.bPhysSlots, from, to, days, labels);
    const svgM = Charts.lineChart({ width, height: 190, from, to, series: sm, bands: extras.bands, markers: [], logged, selected: S.sel.b, col, title: 'Mood', emptyText: !sm.length ? 'Choose mood symptoms' : !sm.some(s => s.points.length) ? 'Nothing recorded in this range' : '' });
    const svgP = Charts.lineChart({ width, height: 190, from, to, series: sp, bands: extras.bands, markers: [], logged, selected: S.sel.b, col, title: 'Physical', emptyText: !sp.length ? 'Choose physical symptoms' : !sp.some(s => s.points.length) ? 'Nothing recorded in this range' : '' });
    $('#chart-bm').innerHTML = svgM; $('#chart-bp').innerHTML = svgP;
    $('#legend-bm').innerHTML = chipsHtml(sm, 'bMood');
    $('#legend-bp').innerHTML = chipsHtml(sp, 'bPhys');
    $('#picked-b').innerHTML = pickedHtml(S.sel.b, [sm, sp], extras);
    LAST.b = { svg: stackSvg([svgM, svgP], width, 190), width, height: 2 * 190 + 44, title: 'mood-vs-physical' };
    // C
    const months = C.monthlySummary(all, { from, to, target: S.cTarget, today: today() }).slice(-18);
    const items = months.map(m => ({ label: C.MONTHS[Number(m.month.slice(5)) - 1], value: m.avgSeverity, sub: m.loggedDays + '/' + m.daysInPeriod + 'd' }));
    const svgC = Charts.barChart({ width, height: 200, items, col, title: 'Average daily high by month' });
    $('#chart-c').innerHTML = svgC + `<p class="small" style="margin:6px 0 0">Bars: average of each logged day's highest score. Below each month: days logged / days in period.</p>`;
    LAST.c = { svg: svgC, width, height: 200, title: 'monthly-comparison' };
    $('#months-c').innerHTML = months.slice().reverse().map(m => {
      const cov = m.daysInPeriod ? Math.round(m.loggedDays / m.daysInPeriod * 100) : 0;
      const f = v => v === null || v === undefined ? '–' : (Math.round(v * 10) / 10).toFixed(1);
      return `<div class="month"><div class="month-h"><h3>${esc(C.fmtMonth(m.month))}</h3><span class="small">${m.loggedDays} of ${m.daysInPeriod} days logged</span></div>
        <div class="cov" aria-hidden="true"><div style="width:${cov}%"></div></div>
        ${m.loggedDays === 0 ? '<p class="small">No symptom entries this month, so there is no information about it.</p>' : `
        <div class="stats">
          <div class="stat"><div class="v">${f(m.avgSeverity)}</div><div class="l">average daily high</div></div>
          <div class="stat"><div class="v">${m.highest === null ? '–' : m.highest}</div><div class="l">highest score</div></div>
          <div class="stat"><div class="v">${m.symptomaticDays}</div><div class="l">symptomatic days</div></div>
          <div class="stat"><div class="v">${m.episodes}</div><div class="l">episodes started</div></div>
          <div class="stat"><div class="v">${f(m.moodAvg)}</div><div class="l">mood avg daily high</div></div>
          <div class="stat"><div class="v">${f(m.physAvg)}</div><div class="l">pain & physical avg daily high</div></div>
        </div>
        <p class="small" style="margin:8px 0 0">Bleeding: ${m.bleedingDays ? m.bleedingDays + ' day' + (m.bleedingDays === 1 ? '' : 's') + ' logged' : 'none logged'}${m.top.length ? ' · Most recorded: ' + m.top.map(t => esc(t.label) + ' (' + t.days + 'd)').join(', ') : ''}</p>`}</div>`;
    }).join('') || '<p class="small">No months in this range.</p>';
    // tap handling
    bindChartTap('#chart-a', 'a', width, from, to, sa);
    bindChartTap('#chart-bm', 'b', width, from, to, sm.concat(sp));
    bindChartTap('#chart-bp', 'b', width, from, to, sm.concat(sp));
  }
  function stackSvg(svgs, width, h) {
    const inner = svgs.map((s, i) => s.replace('<svg ', `<svg y="${i * (h + 24) + 20}" `)).join('');
    const labelsTxt = ['Mood', 'Physical'].map((t, i) => `<text x="4" y="${i * (h + 24) + 14}" font-size="12" font-weight="600" fill="${css('--text')}">${t}</text>`).join('');
    return `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${2 * h + 44}" viewBox="0 0 ${width} ${2 * h + 44}" font-family="-apple-system, system-ui, sans-serif"><rect width="100%" height="100%" fill="${css('--chart-surface')}"/>${labelsTxt}${inner}</svg>`;
  }
  function bindChartTap(sel, which, width, from, to, series) {
    const el = $(sel);
    if (!el) return;
    el.onclick = ev => {
      const rect = el.getBoundingClientRect();
      const g = Charts.geom(width, 240, from, to);
      const x = ev.clientX - rect.left;
      if (x < g.ml - 10 || x > g.ml + g.pw + 10) return;
      let n = Math.max(g.a, Math.min(g.b, g.n(x)));
      // snap to nearest day with an observation (within a small window)
      const obs = new Set(); series.forEach(s => s.points.forEach(p => obs.add(p.n)));
      const win = Math.max(1, Math.round(g.span / 40));
      let best = null;
      for (const o of obs) if (Math.abs(o - n) <= win && (best === null || Math.abs(o - n) < Math.abs(best - n))) best = o;
      if (best !== null) n = best;
      S.sel[which] = n;
      drawCharts();
    };
  }

  function openPicker(which) {
    const { keys, labels } = availableKeys();
    const cur = which === 'a' ? S.aKeys : which === 'bMood' ? S.bMood : S.bPhys;
    const max = which === 'a' ? 6 : 4;
    const allowedGroups = which === 'bMood' ? ['mood'] : which === 'bPhys' ? ['pain', 'physical', 'function'] : C.GROUPS.map(g => g.id);
    const sel = new Set(cur);
    const renderBody = () => {
      let h = `<p class="small">Choose up to ${max}. Symptoms with data in your history are marked with a dot.</p>`;
      if (which === 'a') h += `<div class="row" style="margin-top:6px"><button class="btn btn-small" data-act="pick-set" data-set="pain">Pain locations</button><button class="btn btn-small" data-act="pick-set" data-set="mood">Mood</button><button class="btn btn-small" data-act="pick-set" data-set="clear">Clear</button></div>`;
      for (const g of C.GROUPS.filter(g => allowedGroups.includes(g.id))) {
        const items = g.items.filter(it => !it.custom).map(it => it.id).concat([...keys].filter(k => k.includes(':') && C.seriesGroup(k) === g.id));
        h += `<div class="group-h">${esc(g.label)}</div><div class="chips">${items.map(k => `<button class="chip" data-act="pick-toggle" data-key="${esc(k)}" aria-pressed="${sel.has(k)}">${keys.has(k) ? '• ' : ''}${esc(C.seriesLabel(k, labels))}</button>`).join('')}</div>`;
      }
      h += `<p class="small hidden" id="pick-msg" style="color:var(--danger)">You can show up to ${max} at once. Remove one first.</p>`;
      return h;
    };
    openSheet({ title: 'Choose symptoms', body: renderBody(), footer: `<button class="btn btn-primary btn-block" data-act="pick-done">Show on graph</button>`, onClose: null });
    sheetState.picker = { which, sel, max, keys, renderBody };
  }
  function pickerApply(which, list) {
    if (which === 'a') S.aKeys = list; else if (which === 'bMood') S.bMood = list; else S.bPhys = list;
    saveUI();
  }

  async function savePng(which) {
    const L = LAST[which];
    if (!L) return;
    try {
      const blob = await Charts.svgToPng(L.svg, L.width, L.height);
      await deliverFile(blob, `estelle-${L.title}-${today()}.png`);
    } catch (e) { toast('Could not create the image: ' + e.message); }
  }

  // ---------- Doctor summary (print) ----------
  function printSummary() {
    const all = recs().filter(r => !r.demo || settings().showDemo);
    const [from, to] = rangeDates();
    const { days, labels } = C.buildDays(all);
    const extras = chartExtras(all, from, to);
    const logged = [...days.keys()].map(C.dayNum);
    const col = { surface: '#ffffff', grid: '#e6e6e6', axis: '#999999', muted: '#555555', text: '#000000', band: 'rgba(227,73,72,0.12)', logged: '#888888', marker: '#6250d6', bar: '#2a78d6' };
    const pal = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#6250d6', '#e34948'];
    const mk = (keys, slots) => { assignSlots(keys, slots); return keys.map(k => ({ key: k, label: C.seriesLabel(k, labels), color: pal[slots[k] % 8], points: C.seriesPoints(days, k, from, to) })); };
    const sa = mk(S.aKeys, Object.assign({}, S.aSlots)), sm = mk(S.bMood, Object.assign({}, S.bMoodSlots)), sp = mk(S.bPhys, Object.assign({}, S.bPhysSlots));
    const leg = s => s.map(x => `<span style="margin-right:14px"><span style="display:inline-block;width:14px;height:3px;background:${x.color};vertical-align:middle;margin-right:5px"></span>${esc(x.label)}</span>`).join('');
    const months = C.monthlySummary(all, { from, to, target: 'all', today: today() });
    const f = v => v === null || v === undefined ? '–' : (Math.round(v * 10) / 10).toFixed(1);
    const bleeds = all.filter(r => r.kind === 'bleeding' && (r.data.endDate || today()) >= from && r.data.startDate <= to).sort((a, b) => a.data.startDate.localeCompare(b.data.startDate));
    const meds = all.filter(r => r.kind === 'med' && r.data.date >= from && r.data.date <= to && (r.data.event !== 'taken' || r.data.category === 'ec' || r.data.category === 'hormonal')).sort((a, b) => a.data.date.localeCompare(b.data.date));
    const notes = all.filter(r => r.kind === 'note' && r.data.date >= from && r.data.date <= to);
    $('#print').innerHTML = `
      <h1>Symptom summary: ${esc(settings().name || 'Estelle')}</h1>
      <p>${esc(C.fmtDay(from, true))} to ${esc(C.fmtDay(to, true))} · created ${esc(C.fmtDay(today(), true))}. Self-recorded symptom diary. Scores are 0–10 (0 = none, 10 = worst). Unlogged days are unknown, not symptom-free. Not a diagnostic tool.</p>
      ${hasDemo() && settings().showDemo ? '<p><b>Includes demonstration data.</b></p>' : ''}
      <div class="pb"><h2>Symptoms over time</h2>${Charts.lineChart({ width: 680, height: 260, from, to, series: sa, bands: extras.bands, markers: extras.markers, logged, col })}<p>${leg(sa)}</p><p>Points: highest score each logged day. Shaded: bleeding. Bottom row: days with any entry.</p></div>
      <div class="pb"><h2>Mood</h2>${Charts.lineChart({ width: 680, height: 190, from, to, series: sm, bands: extras.bands, logged, col })}<p>${leg(sm)}</p></div>
      <div class="pb"><h2>Physical</h2>${Charts.lineChart({ width: 680, height: 190, from, to, series: sp, bands: extras.bands, logged, col })}<p>${leg(sp)}</p></div>
      <div class="pb"><h2>Month by month (all symptoms)</h2><table><tr><th>Month</th><th>Days logged</th><th>Avg daily high</th><th>Highest</th><th>Symptomatic days</th><th>Episodes</th><th>Bleeding days</th><th>Most recorded</th></tr>
      ${months.map(m => `<tr><td>${esc(C.fmtMonth(m.month))}</td><td>${m.loggedDays}/${m.daysInPeriod}</td><td>${f(m.avgSeverity)}</td><td>${m.highest === null ? '–' : m.highest}</td><td>${m.symptomaticDays}</td><td>${m.episodes}</td><td>${m.bleedingDays}</td><td>${m.top.map(t => esc(t.label) + ' (' + t.days + ')').join(', ')}</td></tr>`).join('')}</table></div>
      <div class="pb"><h2>Bleeding</h2>${bleeds.length ? '<ul>' + bleeds.map(r => `<li>${esc(C.fmtDay(r.data.startDate, true))} – ${r.data.endDate ? esc(C.fmtDay(r.data.endDate, true)) : 'ongoing'}: ${esc(r.data.type || 'type not recorded')}${r.data.pain !== '' && r.data.pain !== null && r.data.pain !== undefined ? ', pain ' + esc(r.data.pain) : ''}${r.data.notes ? ' – ' + esc(r.data.notes) : ''}</li>`).join('') + '</ul>' : '<p>None logged in this period.</p>'}</div>
      <div class="pb"><h2>Medication changes and events</h2>${meds.length ? '<ul>' + meds.map(r => `<li>${esc(C.fmtDay(r.data.date, true))}: ${esc(MED_EVENT[r.data.event] || 'Taken')} – ${esc(r.data.name || MED_CAT[r.data.category])}${r.data.dose ? ' ' + esc(r.data.dose) : ''}${r.data.sideEffects ? ' (side effects: ' + esc(r.data.sideEffects) + ')' : ''}</li>`).join('') + '</ul>' : '<p>None logged in this period.</p>'}

  // ---------- Patterns ----------

    const from = S.pRange === '180' ? C.addDays(t, -182) : S.pRange === '365' ? C.addDays(t, -364) : first;
    const res = C.patterns(all, { from, to: t, today: t });
    const notes = all.filter(r => r.kind === 'note').sort((a, b) => b.data.date.localeCompare(a.data.date));

      <div class="banner info"><span>These are things that <b>appear</b> in what you've recorded, worked out with simple counts on this phone. They aren't medical conclusions or diagnoses, and they don't show that one thing causes another. They could be worth raising with your doctor.</span></div>

        <button class="btn btn-danger btn-block" data-act="wipe">Delete all my data…</button>
      </div>
      <p class="small" style="text-align:center">Made for ${esc(st.name || 'Estelle')} · storage ${Store.persisted ? 'protected from automatic clearing' : 'standard'}</p>`;
  }

  // ---------- Export / import ----------
  async function deliverFile(blob, filename) {
    let file = null;
    try { file = new File([blob], filename, { type: blob.type }); } catch (e) { /* older browsers */ }
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: filename }); return 'shared'; }
      catch (e) { if (e.name === 'AbortError') return 'cancelled'; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    return 'downloaded';
  }
  function exportRecords() {
    const inc = $('#exp-demo') && $('#exp-demo').checked;
    return Store.list().filter(r => !r.deleted && (inc || !r.demo)).sort((a, b) => sortKey(a).localeCompare(sortKey(b)));
  }
  function backupJson(list) {
    return JSON.stringify({ app: 'estelle-endo-tracker', version: 1, exportedAt: new Date().toISOString(), count: list.length, records: list.map(r => ({ id: r.id, kind: r.kind, data: r.data, createdAt: r.createdAt, updatedAt: r.updatedAt, demo: !!r.demo })) }, null, 1);
  }
  const csvCell = v => { const s = v === null || v === undefined ? '' : String(v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const csv = rows => '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
  function symptomsCsv(list) {
    const ctxKeys = ['stress', 'sleepHours', 'sleepQuality', 'exercise', 'exerciseNote', 'movement', 'bowel', 'appetite', 'food', 'illness', 'sex', 'lifeEvents', 'other'];
    const rows = [['date', 'time', 'entry_id', 'group', 'symptom', 'description', 'severity_0_10', 'no_significant_symptoms', 'duration', 'notes'].concat(ctxKeys.map(k => 'context_' + k)).concat(['demo', 'last_saved'])];
    for (const r of list) if (r.kind === 'entry') {
      const d = r.data, ctx = d.context || {};
      const base = s => [d.date, d.time, r.id, s ? (C.GROUP[C.ITEM[s.id] ? C.ITEM[s.id].group : 'physical'] || {}).label : '', s ? C.ITEM[s.id] ? C.ITEM[s.id].label : s.id : '', s ? s.label || '' : '', s ? (s.severity === null || s.severity === undefined ? 'not rated' : s.severity) : '', d.noSymptoms ? 'yes' : 'no', d.duration, d.notes].concat(ctxKeys.map(k => ctx[k])).concat([r.demo ? 'DEMO' : '', r.updatedAt]);
      if (d.noSymptoms || !(d.symptoms || []).length) rows.push(base(null));
      else d.symptoms.forEach(s => rows.push(base(s)));
    }
    return csv(rows);
  }
  function otherCsv(list) {
    const rows = [['kind', 'date_or_start', 'end_date', 'time', 'type_or_category', 'event', 'name', 'dose', 'pain_0_10', 'symptoms', 'effect', 'side_effects', 'notes', 'record_id', 'demo', 'last_saved']];
    for (const r of list) {
      const d = r.data;
      if (r.kind === 'bleeding') rows.push(['bleeding', d.startDate, d.endDate || 'ongoing', '', d.type, '', '', '', d.pain, d.symptoms, '', '', d.notes, r.id, r.demo ? 'DEMO' : '', r.updatedAt]);
      if (r.kind === 'med') rows.push(['medication', d.date, '', d.time, MED_CAT[d.category], MED_EVENT[d.event], d.name, d.dose, '', '', d.effect, d.sideEffects, d.notes, r.id, r.demo ? 'DEMO' : '', r.updatedAt]);
      if (r.kind === 'note') rows.push(['note', d.date, '', '', d.tag === 'pattern' ? 'suspected pattern' : 'note', '', '', '', '', '', '', '', d.text, r.id, r.demo ? 'DEMO' : '', r.updatedAt]);
    }
    return csv(rows);
  }
  async function doExport(kind) {
    const list = exportRecords();
    let blob, name;
    if (kind === 'json') { blob = new Blob([backupJson(list)], { type: 'application/json' }); name = `estelle-tracker-backup-${today()}.json`; }
    if (kind === 'sym') { blob = new Blob([symptomsCsv(list)], { type: 'text/csv' }); name = `estelle-symptoms-${today()}.csv`; }
    if (kind === 'other') { blob = new Blob([otherCsv(list)], { type: 'text/csv' }); name = `estelle-bleeding-medication-notes-${today()}.csv`; }
    const res = await deliverFile(blob, name);
    if (kind === 'json' && res !== 'cancelled') { await Store.setMeta('lastBackup', new Date().toISOString()); render(); }
    if (res !== 'cancelled') toast(kind === 'json' ? 'Backup created (' + list.length + ' records)' : 'Export created');
  }
  async function doRestore(file) {
    let parsed;
    try { parsed = JSON.parse(await file.text()); } catch (e) { toast("That file isn't a valid backup."); return; }
    if (!parsed || parsed.app !== 'estelle-endo-tracker' || !Array.isArray(parsed.records)) { toast("That file isn't a backup from this app."); return; }
    const res = C.mergeImport(Store.records, parsed.records);
    if (!confirm(`Restore from backup made ${parsed.exportedAt ? fmtStamp(parsed.exportedAt) : 'at an unknown time'}?\n\n${res.added} new record(s) will be added, ${res.updated} will be updated with a newer version, ${res.skipped} are already up to date. Nothing will be deleted.`)) return;
    try { await Store.putMany(res.puts); render(); toast(`Restored: ${res.added} added, ${res.updated} updated`); Cloud.sync(); }
    catch (e) { toast('Restore failed: ' + e.message); }
  }

  // ---------- Demo data ----------
  async function addDemo() {
    const t = today();
    const out = [];
    let seed = 7;
    const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
    const now = new Date().toISOString();
    const mkRec = (kind, data) => ({ id: uuid(), kind, data, createdAt: now, updatedAt: now, deleted: false, demo: true, dirty: false });
    for (let i = 150; i >= 0; i--) {
      const d = C.addDays(t, -i);
      const phase = (150 - i) % 28;
      const flare = phase >= 20 && phase <= 25;
      if (rnd() > (flare ? 0.85 : 0.45)) continue;
      if (!flare && rnd() < 0.35) { out.push(mkRec('entry', { date: d, time: '21:00', noSymptoms: true, symptoms: [], duration: '', notes: '[DEMO] felt okay', context: {} })); continue; }
      const base = flare ? 5 : 2;
      const sev = () => Math.max(0, Math.min(10, Math.round(base + rnd() * 4 - 1)));
      const sy = [{ id: 'pelvic', severity: sev() }];
      if (rnd() < 0.6) sy.push({ id: 'ovary_r', severity: sev() });
      if (rnd() < 0.5) sy.push({ id: 'bloating', severity: sev() });
      if (flare || rnd() < 0.3) sy.push({ id: 'low_mood', severity: Math.max(0, sev() - 1) });
      if (rnd() < 0.3) sy.push({ id: 'fatigue', severity: sev() });
      if (rnd() < 0.15) sy.push({ id: 'nausea', severity: null });
      out.push(mkRec('entry', { date: d, time: '18:30', noSymptoms: false, symptoms: sy, duration: flare ? 'All day' : 'A few hours', notes: '[DEMO] sample entry', context: rnd() < 0.5 ? { stress: Math.round(rnd() * 10), sleepHours: Math.round((5 + rnd() * 4) * 2) / 2 } : {} }));
      if (flare && rnd() < 0.3) out.push(mkRec('entry', { date: d, time: '08:00', noSymptoms: false, symptoms: [{ id: 'lower_back', severity: sev() }], duration: '', notes: '[DEMO] morning', context: {} }));
    }
    out.push(mkRec('bleeding', { startDate: C.addDays(t, -40), endDate: C.addDays(t, -37), type: 'spotting', pain: 4, symptoms: 'cramping', notes: '[DEMO] unexpected spotting' }));
    out.push(mkRec('med', { date: C.addDays(t, -60), time: '', category: 'dienogest', event: 'missed', name: 'Dienogest', dose: '', effect: '', sideEffects: '', notes: '[DEMO]' }));
    out.push(mkRec('med', { date: C.addDays(t, -10), time: '14:00', category: 'pain', event: 'taken', name: 'Ibuprofen', dose: '400 mg', effect: 'eased after an hour', sideEffects: '', notes: '[DEMO]' }));
    out.push(mkRec('note', { date: C.addDays(t, -20), tag: 'pattern', text: '[DEMO] Pain seems to flare roughly monthly' }));
    try { await Store.putMany(out); await Store.setMeta('settings', Object.assign(settings(), { showDemo: true })); render(); toast(out.length + ' demo records added'); }
    catch (e) { toast('Could not add demo data: ' + e.message); }
  }
  async function removeDemo() {
    const ids = Store.list().filter(r => r.demo).map(r => r.id);
    if (!confirm('Remove all ' + ids.length + ' demo records? Your real entries are not affected.')) return;
    try { await Store.hardDelete(ids); render(); toast('Demo data removed'); } catch (e) { toast('Could not remove demo data: ' + e.message); }
  }

  // ---------- Wipe ----------
  function openWipe() {
    const body = `<p>This permanently deletes <b>every record</b> on this phone${Cloud.signedIn() ? ' and in your cloud database' : ''}. It can't be undone.</p>
      <p class="small">To also delete the cloud login itself, delete the user (or the whole project) in the Supabase dashboard afterwards.</p>
      <label class="f" for="wipe-confirm">Type DELETE to confirm</label><input class="field" id="wipe-confirm" autocapitalize="characters" autocomplete="off">`;
    openSheet({ title: 'Delete all data', body, footer: `<div class="save-msg hidden" id="save-msg" role="alert"></div><button class="btn btn-danger btn-block" data-act="wipe-go">Delete everything</button>` });
  }
  async function doWipe() {
    if ($('#wipe-confirm').value.trim().toUpperCase() !== 'DELETE') return showSaveMsg('Type DELETE to confirm.');
    try {
      if (Cloud.signedIn()) await Cloud.deleteAllRemote();
      await Store.clearAll();
      await Store.setMeta('lastSync', null);
      closeSheet(true); render(); toast('All data deleted');
    } catch (e) { showSaveMsg('Not finished: ' + e.message + '. Nothing on this phone was deleted.'); }
  }

  // ---------- events ----------
  const actions = {
    tab: el => { if (closeSheet()) { S.tab = el.dataset.tab; saveUI(); window.scrollTo(0, 0); render(); } },
    log: () => openEntry(null),
    'log-day': el => { closeSheet(true); openEntry(null, el.dataset.date); },
    'none-day': el => quickNoSymptoms(el.dataset.date),
    'no-symptoms': () => quickNoSymptoms(today()),
    bleeding: () => openBleeding(null),
    med: () => openMed(null),
    note: () => openNote(null),
    edit: el => { closeSheet(true); openEdit(el.dataset.id); },
    day: el => openDay(el.dataset.date),
    'sheet-close': () => closeSheet(),
    sym: el => {
      const id = el.dataset.id;
      const i = F.d.symptoms.findIndex(s => s.id === id);
      if (i >= 0) F.d.symptoms.splice(i, 1); else F.d.symptoms.push({ id, severity: undefined });
      const g = C.ITEM[id].group;
      $('#grp-' + g).innerHTML = groupBlock(C.GROUP[g]);
      const u = $('#usual'); if (u) u.innerHTML = usualKeys().map(chipFor).join('');
      if (i < 0) { const row = $(`[data-row="${id}"]`); if (row && row.scrollIntoView) row.scrollIntoView({ block: 'nearest' }); }
    },
    sev: el => {
      const name = el.dataset.name, v = el.dataset.v;
      $$(`[data-sev="${name}"] button`).forEach(b => b.setAttribute('aria-pressed', String(b === el)));
      if (name.startsWith('sev-')) { const s = F.d.symptoms.find(x => x.id === name.slice(4)); if (s) s.severity = v === '?' ? null : Number(v); }
    },
    seg: el => {
      const name = el.dataset.name;
      const was = el.getAttribute('aria-pressed') === 'true';
      $$(`[data-seg="${name}"] button`).forEach(b => b.setAttribute('aria-pressed', 'false'));
      if (!was) el.setAttribute('aria-pressed', 'true');
      if (name === 'm-event') { const l = $('#m-dose-l'); if (l) l.textContent = el.dataset.v === 'change' && !was ? 'New dose' : 'Dose'; }
    },
    medcat: el => {
      $$('[data-act="medcat"]').forEach(b => b.setAttribute('aria-pressed', String(b === el)));
      if (el.dataset.v === 'dienogest') { if (!$('#m-name').value) $('#m-name').value = 'Dienogest'; if (!$('#m-dose').value) $('#m-dose').value = settings().dienogestDose || ''; }
    },
    dur: el => { $('#e-duration').value = el.dataset.v; },
    'cal-day': el => { const ds = el.dataset.date; if (F.multi.has(ds)) F.multi.delete(ds); else F.multi.add(ds); renderCal(); },
    'cal-prev': () => { const [y, m] = F.calMonth.split('-').map(Number); F.calMonth = m === 1 ? (y - 1) + '-12' : y + '-' + String(m - 1).padStart(2, '0'); renderCal(); },
    'cal-next': () => { const [y, m] = F.calMonth.split('-').map(Number); const nx = m === 12 ? (y + 1) + '-01' : y + '-' + String(m + 1).padStart(2, '0'); if (nx <= C.monthKey(today())) { F.calMonth = nx; renderCal(); } },
    'cal-fill': () => { const sel = [...F.multi].sort(); for (let n = C.dayNum(sel[0]); n <= C.dayNum(sel[sel.length - 1]); n++) F.multi.add(C.dayStr(n)); renderCal(); },
    'cal-clear': () => { F.multi.clear(); renderCal(); },
    'save-entry': saveEntry, 'save-bleeding': saveBleeding, 'save-med': saveMed, 'save-note': saveNote,
    delete: deleteCurrent,
    'hist-kind': el => { S.hist.kind = el.dataset.kind; S.histLimit = 60; saveUI(); render(); },
    'hist-order': () => { S.hist.order = S.hist.order === 'desc' ? 'asc' : 'desc'; saveUI(); render(); },
    'hist-more': () => { S.histLimit += 100; render(); },
    range: el => { S.range.preset = el.dataset.v; if (el.dataset.v === 'custom' && !S.range.from) { const [f, t] = [C.addDays(today(), -89), today()]; S.range.from = f; S.range.to = t; } saveUI(); render(); },
    prange: el => { S.pRange = el.dataset.v; saveUI(); render(); },
    pick: el => openPicker(el.dataset.which),
    unpick: el => {
      const w = el.dataset.which, k = el.dataset.key;
      const list = (w === 'a' ? S.aKeys : w === 'bMood' ? S.bMood : S.bPhys).filter(x => x !== k);
      pickerApply(w, list); drawCharts();
    },
    'pick-toggle': el => {
      const P = sheetState && sheetState.picker; if (!P) return;
      const k = el.dataset.key;
      if (P.sel.has(k)) P.sel.delete(k);
      else if (P.sel.size >= P.max) { $('#pick-msg').classList.remove('hidden'); return; }
      else P.sel.add(k);
      el.setAttribute('aria-pressed', String(P.sel.has(k)));
      $('#pick-msg').classList.add('hidden');
    },
    'pick-set': el => {
      const P = sheetState && sheetState.picker; if (!P) return;
      P.sel.clear();
      if (el.dataset.set !== 'clear') {
        const grp = el.dataset.set;
        const withData = C.GROUP[grp].items.filter(it => !it.custom && P.keys.has(it.id)).map(it => it.id);
        const fill = withData.length ? withData : C.GROUP[grp].items.filter(it => !it.custom).map(it => it.id);
        fill.slice(0, P.max).forEach(k => P.sel.add(k));
      }
      $('#sheet-b').innerHTML = P.renderBody();
    },
    'pick-done': () => {
      const P = sheetState && sheetState.picker; if (!P) return;
      const cur = P.which === 'a' ? S.aKeys : P.which === 'bMood' ? S.bMood : S.bPhys;
      const list = cur.filter(k => P.sel.has(k)).concat([...P.sel].filter(k => !cur.includes(k)));
      pickerApply(P.which, list);
      closeSheet(true); drawCharts();
    },
    png: el => savePng(el.dataset.which),
    summary: printSummary,
    'export-json': () => doExport('json'), 'export-csv-sym': () => doExport('sym'), 'export-csv-other': () => doExport('other'),
    restore: () => $('#restore-file').click(),
    'demo-add': addDemo, 'demo-remove': removeDemo,
    'save-settings': async () => {
      try { await Store.setMeta('settings', Object.assign(settings(), { name: $('#set-name').value.trim() || 'Estelle', dienogestDose: $('#set-dose').value.trim() })); toast('Settings saved'); render(); }
      catch (e) { toast('Not saved: ' + e.message); }
    },
    'cloud-save': async () => {
      let url = $('#cl-url').value.trim(), key = $('#cl-key').value.trim();
      if (!/^https:\/\/[^\s/]+/.test(url)) { toast('The Project URL should start with https://'); return; }
      if (key.length < 20) { toast('That key looks too short. Copy the publishable (anon) key.'); return; }
      if (/^sb_secret_/.test(key) || /service_role/.test(atobSafe(key))) { toast("That's a secret key. Use the publishable (anon) key instead. Never put the secret key in an app."); return; }
      await Store.setMeta('cloud', { url: url.replace(/\/+$/, ''), key });
      render(); Cloud.sync();
    },
    'cloud-reset': async () => { if (confirm('Disconnect from this cloud project? Entries stay on this phone.')) { await Store.setMeta('cloud', null); await Store.setMeta('session', null); Cloud.set('local', 'Saved on this phone only.'); render(); } },
    'cloud-signin': async el => {
      const email = $('#cl-email').value.trim(), pw = $('#cl-pw').value;
      if (!email || !pw) { toast('Enter your email and password'); return; }
      el.disabled = true;
      try { await Cloud.signIn(email, pw); toast('Signed in. Syncing…'); render(); await Cloud.sync(); render(); }
      catch (e) { toast('Sign-in failed: ' + e.message); el.disabled = false; }
    },
    'cloud-signup': async el => {
      const email = $('#cl-email').value.trim(), pw = $('#cl-pw').value;
      if (!email || pw.length < 8) { toast('Enter your email and a password of at least 8 characters'); return; }
      el.disabled = true;
      try {
        const r = await Cloud.signUp(email, pw);
        if (r.session) { toast('Account created. Syncing…'); render(); await Cloud.sync(); render(); }
        else { alert('Account created. Check your email and tap the confirmation link, then come back here and tap "Sign in".'); el.disabled = false; }
      } catch (e) { toast('Could not create account: ' + e.message); el.disabled = false; }
    },
    'cloud-sync': async () => { await Cloud.sync(); render(); },
    'cloud-signout': async () => { if (confirm('Sign out of the cloud? Entries stay on this phone; new ones will sync when you sign in again.')) { await Cloud.signOut(); render(); } },
    wipe: openWipe, 'wipe-go': doWipe
  };
  function atobSafe(k) { try { return atob(k.split('.')[1] || ''); } catch (e) { return ''; } }

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const fn = actions[el.dataset.act];
    if (fn) { e.preventDefault(); fn(el); }
  });
  document.addEventListener('input', e => {
    const el = e.target;
    if (el.id === 'e-none' || el.id === 'e-multi') return;
    const k = el.dataset && el.dataset.in;
    if (k === 'hist-q') { S.hist.q = el.value; S.histLimit = 60; saveUI(); const pos = el.selectionStart; render(); const n = $('[data-in="hist-q"]'); n.focus(); try { n.setSelectionRange(pos, pos); } catch (er) { /* search inputs */ } }
    if (k === 'sym-label') { const s = F.d.symptoms.find(x => x.id === el.dataset.id); if (s) s.label = el.value; }
  });
  document.addEventListener('change', async e => {
    const el = e.target;
    if (el.id === 'e-none') $('#sym-area').classList.toggle('hidden', el.checked);
    if (el.id === 'e-multi') {
      if (el.checked) { const cur = $('#e-date').value; if (cur && !F.multi.size) F.multi.add(cur); if (cur) F.calMonth = C.monthKey(cur); renderCal(); }
      $('#multi-cal').classList.toggle('hidden', !el.checked);
      $('#e-single').classList.toggle('hidden', el.checked);
    }
    if (el.id === 'b-ongoing') { $('#b-end').disabled = el.checked; if (!el.checked && !$('#b-end').value) $('#b-end').value = today(); }
    if (el.id === 'restore-file' && el.files[0]) { await doRestore(el.files[0]); el.value = ''; }
    const k = el.dataset && el.dataset.in;
    if (k === 'range-from' || k === 'range-to') { S.range[k === 'range-from' ? 'from' : 'to'] = el.value; saveUI(); render(); }
    if (k === 'c-target') { S.cTarget = el.value; saveUI(); drawCharts(); }
    if (k === 'show-demo') { await Store.setMeta('settings', Object.assign(settings(), { showDemo: el.checked })); render(); }
  });
  let rz;
  window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(drawCharts, 150); });
  window.addEventListener('online', () => Cloud.sync());
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') Cloud.sync(); });
  setInterval(() => { if (Store.list().some(r => r.dirty && !r.demo)) Cloud.sync(); }, 120000);
  Cloud.onChange(() => { if (!sheetState) { const p = $('.screen-head .head-actions'); if (p) p.outerHTML = headActions(); } });

  // ---------- start ----------
  async function start() {
    try { await Store.init(); }
    catch (e) { Store.failed = e.message || 'unknown error'; }
    if (!Cloud.configured()) Cloud.set('local', 'Saved on this phone only. Cloud backup is not set up.');
    render();
    Cloud.sync().then(() => { if (!sheetState) render(); });
    if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  window.__app = { S, render, Store, Cloud, actions, symptomsCsv, otherCsv, backupJson };
  start();
})();
</script>
